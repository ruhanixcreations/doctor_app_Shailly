<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Print Prescription</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- html2pdf for Save PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body{font-family:Inter,system-ui,Arial,sans-serif;padding:18px;color:#071123;background:#f7fbff}
  .paper{background:#fff;padding:18px;border-radius:8px;max-width:960px;margin:0 auto;box-shadow:0 8px 30px rgba(9,30,66,0.06)}
  h1{font-size:18px;margin-bottom:12px}
  .top-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
  .btn{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:700}
  .btn.save{background:#28a745;color:#fff}
  .btn.print{background:#0b63c6;color:#fff}
  .meta{font-size:14px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px}
  .meta .item{min-width:160px}
  .label{font-weight:700;color:#183159}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th,td{padding:8px;border:1px solid #eee;text-align:left;vertical-align:top}
  thead th{background:#f6f9ff}
  @media print {
    .top-actions { display: none; }
    body { background: #fff; padding: 0; }
    .paper { box-shadow:none; border-radius:0; margin:0; padding:0.5in; }
  }
</style>
</head>
<body>
  <div class="top-actions">
    <button id="savePdfBtn" class="btn save">Save PDF</button>
    <button id="printBtn" class="btn print">Print</button>
  </div>

  <div id="printArea" class="paper" aria-live="polite">
    <h1>Prescription</h1>

    <div id="meta" class="meta">
      <div class="item"><span class="label">Patient:</span> <span id="patientName">-</span></div>
      <div class="item"><span class="label">Patient ID:</span> <span id="patientId">-</span></div>
      <div class="item"><span class="label">Mobile:</span> <span id="patientMobile">-</span></div>
      <div class="item"><span class="label">Age / Weight:</span> <span id="patientAgeWeight">-</span></div>
      <div class="item"><span class="label">Prescription ID:</span> <span id="presId">-</span></div>
      <div class="item"><span class="label">Date:</span> <span id="presDate">-</span></div>
    </div>

    <div style="overflow-x:auto">
      <table id="printTable" role="table" aria-label="Prescription items">
        <thead>
          <tr>
            <th style="width:48px">#</th>
            <th>Symptoms</th>
            <th>Medicine</th>
            <th>Type</th>
            <th>Duration</th>
            <th>Time</th>
            <th>Before/After</th>
            <th>Notes</th>
            <th>Recommended Test</th>
            <th>Follow-up</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="extras" style="margin-top:12px">
      <!-- kept for compatibility; these are also displayed in the table -->
      <div id="bloodLabel" style="display:none;margin-top:6px;"><span class="label">Recommended blood test:</span> <span id="bloodText"></span></div>
      <div id="followLabel" style="display:none;margin-top:6px;"><span class="label">Follow-up date:</span> <span id="followText"></span></div>
    </div>
  </div>

<script>
function q(name){ const p = new URLSearchParams(location.search); return p.get(name); }
const presId = q('prescription_id');
const patientIdFromQuery = q('patient_id');

// escape helper
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// format date (YYYY-MM-DD or date string) to a readable local date
function prettyDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())){
    // try extracting yyyy-mm-dd from string
    const m = (d+'').match(/(\d{4}-\d{2}-\d{2})/);
    if(m) return new Date(m[1]).toLocaleDateString();
    return d;
  }
  return dt.toLocaleDateString();
}

async function loadAndRender(){
  if(!patientIdFromQuery){
    alert('Missing patient_id in URL. Use print.html?prescription_id=...&patient_id=...');
    return;
  }

  try{
    const res = await fetch(`add_prescription.php?action=get_prescriptions&patient_id=${encodeURIComponent(patientIdFromQuery)}`);
    const j = await res.json();
    if(!j.success){
      alert('Failed to load prescriptions: ' + (j.message || 'unknown'));
      return;
    }

    const allItems = Array.isArray(j.items) ? j.items : [];
    // filter for this prescription if presId provided
    const items = presId ? allItems.filter(it => String(it.prescription_id) === String(presId)) : allItems;

    // If items array is empty but there are items in DB (maybe prescription-level record exists),
    // attempt to still determine date and patient info from the full list (allItems).
    const tbody = document.querySelector('#printTable tbody');
    tbody.innerHTML = '';

    // If no items found for the specific presId but allItems contains entries for patient,
    // try to use a representative prescription row for meta (choose latest by created_at).
    let metaSource = null;
    if(items.length > 0) metaSource = items[0];
    else if(allItems.length > 0) metaSource = allItems[0];

    // render rows (if items empty, show a single "No items" row)
    if(items.length === 0){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="10">No prescription items found for this prescription.</td>`;
      tbody.appendChild(tr);
    } else {
      items.forEach((it, idx) => {
        const recommended = it.recommended_blood_test || it.blood_test_name || '';
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${idx+1}</td>
          <td>${esc(it.symptoms)}</td>
          <td>${esc(it.medicine_name)}</td>
          <td>${esc(it.type)}</td>
          <td>${esc(it.duration)}</td>
          <td>${esc(it.times_of_day)}</td>
          <td>${esc(it.before_after)}</td>
          <td>${esc(it.notes)}</td>
          <td>${esc(recommended)}</td>
          <td>${esc(prettyDate(it.follow_up_date))}</td>`;
        tbody.appendChild(tr);
      });
    }

    // Populate meta: patient name/mobile/age/weight.
    // First try to derive from returned items (if server included patient fields).
    let patientName = (metaSource && metaSource.patient_name) ? metaSource.patient_name : null;
    let patientMobile = (metaSource && metaSource.mobile) ? metaSource.mobile : null;
    let patientAge = (metaSource && metaSource.age) ? metaSource.age : null;
    let patientWeight = (metaSource && metaSource.weight) ? metaSource.weight : null;
    let presDate = (metaSource && metaSource.created_at) ? metaSource.created_at.split(' ')[0] : null;

    // If patientName is missing, fetch list_patients to find details
    if(!patientName){
      try{
        const rp = await fetch('add_prescription.php?action=list_patients');
        const jp = await rp.json();
        if(jp.success && Array.isArray(jp.patients)){
          const p = jp.patients.find(x => String(x.patient_id) === String(patientIdFromQuery));
          if(p){
            patientName = p.patient_name || patientName;
            patientMobile = p.mobile || patientMobile;
            patientAge = p.age || patientAge;
            patientWeight = p.weight || patientWeight;
            // if list_patients included last_visit, and presDate not set, prefer that
            if(!presDate && p.last_visit) presDate = p.last_visit;
          }
        }
      }catch(e){
        console.warn('Failed list_patients lookup', e);
      }
    }

    // fill meta DOM
    document.getElementById('patientName').textContent = patientName || '-';
    document.getElementById('patientId').textContent = patientIdFromQuery || '-';
    document.getElementById('patientMobile').textContent = patientMobile || '-';
    document.getElementById('patientAgeWeight').textContent = (patientAge ? patientAge : '-') + ' / ' + (patientWeight ? patientWeight : '-');
    document.getElementById('presId').textContent = presId || (metaSource && metaSource.prescription_id) || '-';
    document.getElementById('presDate').textContent = presDate ? prettyDate(presDate) : new Date().toLocaleDateString();

    // recommended blood test: prefer prescription-level (blood_test_name) then recommended_blood_test in item
    let recommendedTest = '';
    if(items.length){
      const byPres = items.find(it => it.blood_test_name && it.blood_test_name.trim() !== '');
      const byItem = items.find(it => it.recommended_blood_test && it.recommended_blood_test.trim() !== '');
      recommendedTest = (byPres && byPres.blood_test_name) || (byItem && byItem.recommended_blood_test) || '';
    } else if(allItems.length){
      const byPres = allItems.find(it => it.blood_test_name && it.blood_test_name.trim() !== '');
      const byItem = allItems.find(it => it.recommended_blood_test && it.recommended_blood_test.trim() !== '');
      recommendedTest = (byPres && byPres.blood_test_name) || (byItem && byItem.recommended_blood_test) || '';
    }

    if(recommendedTest){
      document.getElementById('bloodText').textContent = recommendedTest;
      document.getElementById('bloodLabel').style.display = 'block';
    } else {
      document.getElementById('bloodLabel').style.display = 'none';
    }

    // follow-up: first found follow_up_date in items (prefer pres items for this prescription), fallback to metaSource
    let followDate = '';
    if(items.length){
      const anyFollow = items.find(it => it.follow_up_date && String(it.follow_up_date).trim() !== '');
      if(anyFollow) followDate = anyFollow.follow_up_date;
    }
    if(!followDate && metaSource && metaSource.follow_up_date) followDate = metaSource.follow_up_date;
    if(followDate){
      document.getElementById('followText').textContent = prettyDate(followDate);
      document.getElementById('followLabel').style.display = 'block';
    } else {
      document.getElementById('followLabel').style.display = 'none';
    }

  }catch(err){
    console.error(err);
    alert('Failed to load data: ' + (err.message || err));
  }
}

/* Save PDF (html2pdf) */
document.getElementById('savePdfBtn').addEventListener('click', ()=>{
  const element = document.getElementById('printArea');
  const opts = { margin:0.4, filename:`prescription_${presId||'print'}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'in',format:'a4',orientation:'portrait'} };
  html2pdf().set(opts).from(element).save();
});
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

loadAndRender();
</script>
</body>
</html>
