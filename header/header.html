<header class="main-header">
  <div class="header-container">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand">
        <i class="fas fa-stethoscope"></i>
        <span class="brand-name">Ruhanix Healthcare</span>
      </div>
    </div>
    
    <div class="header-center">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="search" placeholder="Search patients, medicines..." aria-label="Search">
      </div>
    </div>
    
    <div class="header-right">
      <button class="header-btn notification-btn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="badge">3</span>
      </button>
      
      <div class="user-menu">
        <button class="user-btn" id="userMenuBtn" aria-label="User menu">
          <div class="user-avatar">
            <i class="fas fa-user-md"></i>
          </div>
          <span class="user-name">Dr. Admin</span>
          <i class="fas fa-chevron-down"></i>
        </button>
        
        <div class="user-dropdown" id="userDropdown">
          <div class="dropdown-header">
            <div class="user-avatar-large">
              <i class="fas fa-user-md"></i>
            </div>
            <div class="user-info">
              <div class="user-name-large">Dr. Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item">
            <i class="fas fa-user-circle"></i>
            <span>My Profile</span>
          </a>
          <a href="#" class="dropdown-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
          <a href="#" class="dropdown-item">
            <i class="fas fa-question-circle"></i>
            <span>Help & Support</span>
          </a>
          <div class="dropdown-divider"></div>
          <a href="../signin/signin.html" class="dropdown-item logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
