<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Doctors — Ruhanix</title>

<style>
:root{
  --bg:#f5f8ff;
  --card:#fff;
  --sea:#6f9ef0;
  --sea-dark:#183159;
  --muted:#6b7280;
  --danger:#ff5a5f;
  --radius:12px;
  --shadow:0 12px 32px rgba(9,30,66,0.06);
  --overlay: rgba(6,12,24,0.48);
  --disabled-grey:#d6d6d6;
  --disabled-text:#6b6b6b;
  --input-shadow: 0 12px 30px rgba(13,30,60,0.08);
  --cell-padding-right: 18px;
}

/* base */
*{box-sizing:border-box}
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
  color:#0b2340;
  padding:20px;
  -webkit-font-smoothing:antialiased;
}

.container{
  max-width:980px;
  margin:18px auto;
  background:var(--card);
  padding:18px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:20px}

/* controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.input{padding:10px;border-radius:10px;border:1px solid #e7eefc;min-width:0;min-height:40px; box-shadow:var(--input-shadow)}
.small{font-size:13px;color:var(--muted)}

/* table */
.table{width:100%;border-collapse:collapse;margin-top:6px}
.table th,.table td{padding:10px;border-bottom:1px solid #f0f4fb;text-align:left;font-size:14px}
.table th{font-weight:700;background:#fbfeff}
.action-btn{background:var(--danger);color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer}

/* Buttons - same sea gradient as All Medicines */
.btn{
  background:linear-gradient(90deg,var(--sea-dark),var(--sea));
  color:#fff;
  border:none;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  height:40px;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn.ghost{background:#fff;border:1px solid #e7eefc;color:var(--sea-dark)}
.btn.secondary{ background:transparent; border:1px solid rgba(11,18,35,0.06); color:var(--muted) }

/* Disabled style */
.btn[disabled]{
  background: var(--disabled-grey) !important;
  color: var(--disabled-text) !important;
  cursor: not-allowed;
  box-shadow: none;
  opacity: 1;
}

.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:2000}
.hidden{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{flex:1 1 220px;min-width:160px}
.note{font-size:13px;color:#6b7280;margin-top:8px}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--overlay); z-index:1200; padding:16px;
}
.modal{
  width:100%;
  max-width:560px;
  background:var(--card);
  border-radius:12px;
  padding:16px;
  box-shadow:0 30px 80px rgba(8,18,40,0.18);
  border:1px solid rgba(16,42,83,0.06);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.modal-title{font-weight:700;color:var(--sea-dark)}
.modal-body{display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row .input{flex:1;min-width:120px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

/* Default cell-value styling: desktop - ellipsis */
.cell-value{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* responsive - stacked rows + scrollable value area inside cell */
@media (max-width:760px){
  .modal{ width:100%; max-width:480px; padding:12px }
  .container{ padding:12px }
  .table thead{ display:none }
  .table, .table tbody, .table tr, .table td{ display:block; width:100% }
  .table tr{ margin-bottom:12px; border-radius:10px; box-shadow: 0 8px 20px rgba(9,30,66,0.04); overflow:hidden; background:#fff }
  .table td{
    display:flex;
    justify-content:flex-start;
    padding:10px 12px;
    border-bottom:1px solid rgba(11,18,35,0.04);
    white-space:normal;
    gap:8px;
    align-items:center;
  }
  .table td::before{
    content: attr(data-label);
    font-weight:600;
    color:var(--muted);
    flex:0 0 35%;
    max-width:35%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cell-value{
    flex:1 1 65%;
    max-width:65%;
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    text-align:right;
    padding-right: var(--cell-padding-right);
  }
  .table td[data-label="Actions"]{
    justify-content:flex-end;
  }
  .table td[data-label="Actions"]::before{
    display:none;
  }
  .cell-value::-webkit-scrollbar{ height:8px }
  .cell-value::-webkit-scrollbar-thumb{ background:rgba(0,0,0,0.12); border-radius:6px }
}

/* accessibility */
.visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap }
</style>
</head>
<body>
  <main class="container" aria-live="polite">
    <div class="header">
      <h2>Doctors List</h2>
      <div style="display:flex;gap:12px;align-items:center">
        <button id="openAddBtn" class="btn" aria-haspopup="dialog" aria-controls="addDoctorModal">+ Add Doctor</button>
      </div>
    </div>

    <div class="controls" style="margin-top:4px; width:100%;">
      <input id="filter" class="input" placeholder="Filter by name, email, mobile, role or date" aria-label="Filter doctors" style="width:100%;">
    </div>

    <div id="status" class="small" style="min-height:18px"></div>

    <table class="table" id="tbl" role="table" aria-label="Doctors table">
      <thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Created</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <div id="toast" class="toast" role="status" aria-hidden="true"></div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
    <div class="modal" id="addDoctorModal" role="document" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Add Doctor — Email verification required</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="modalClose" class="btn secondary" aria-label="Close dialog">Close</button>
        </div>
      </div>

      <div class="modal-body">
        <div class="note">Enter email and click <strong>Send OTP</strong>. Verify OTP, then complete details and click <strong>Create Doctor</strong>.</div>

        <div class="form-row">
          <input id="dName" class="input col" placeholder="Full name (letters only)" aria-label="Full name">
        </div>

        <div class="form-row">
          <input id="dMobile" class="input col" placeholder="Mobile (10 digits)" inputmode="tel" aria-label="Mobile">
          <input id="dEmail" class="input col" placeholder="Email address" type="email" aria-label="Email">
        </div>

        <div class="form-row" style="align-items:center;gap:8px">
          <button id="sendOtpBtn" class="btn" disabled>Send OTP</button>
          <div id="sendStatus" class="small" style="min-width:140px"></div>
        </div>

        <div id="otpSection" class="hidden">
          <div class="form-row">
            <input id="otpInput" class="input col" placeholder="Enter OTP (6 digits)" inputmode="numeric" maxlength="6" aria-label="OTP">
            <button id="verifyOtpBtn" class="btn" disabled>Verify OTP</button>
            <button id="resendOtpBtn" class="btn ghost">Resend</button>
          </div>
          <div id="otpNote" class="note"></div>
        </div>

        <div id="createSection" class="hidden">
          <div class="form-row">
            <input id="password" class="input col" placeholder="Password (min 6 char)" type="password" aria-label="Password">
            <input id="confirmPassword" class="input col" placeholder="Confirm password" type="password" aria-label="Confirm password">
          </div>

          <div class="form-row" style="justify-content:flex-end;align-items:center">
            <div id="createStatus" class="small" style="margin-right:auto"></div>
            <button id="createBtn" class="btn" disabled>Create Doctor</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const signupEndpoint = '../signup/signup.php';
const apiList = 'doctors_list.php';

const openAddBtn = document.getElementById('openAddBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalCloseBtn = document.getElementById('modalClose');
const sendOtpBtn = document.getElementById('sendOtpBtn');
const sendStatus = document.getElementById('sendStatus');
const otpSection = document.getElementById('otpSection');
const otpInput = document.getElementById('otpInput');
const verifyOtpBtn = document.getElementById('verifyOtpBtn');
const resendOtpBtn = document.getElementById('resendOtpBtn');
const otpNote = document.getElementById('otpNote');
const createSection = document.getElementById('createSection');
const createBtn = document.getElementById('createBtn');
const createStatus = document.getElementById('createStatus');
const filterInput = document.getElementById('filter');
const tblBody = document.querySelector('#tbl tbody');
const toast = document.getElementById('toast');
const statusEl = document.getElementById('status');

const dName = document.getElementById('dName');
const dMobile = document.getElementById('dMobile');
const dEmail = document.getElementById('dEmail');
const password = document.getElementById('password');
const confirmPassword = document.getElementById('confirmPassword');

let otpVerified = false;
let resendTimer = null;
let doctorsMemory = [];

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = 'block';
  toast.setAttribute('aria-hidden','false');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ toast.style.display='none'; toast.setAttribute('aria-hidden','true'); }, 3200);
}
function setStatus(msg){ if(statusEl) statusEl.textContent = msg; }
function escapeHtml(s){ if(!s) return ''; return s.toString().replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openModal(){
  modalOverlay.style.display = 'flex';
  modalOverlay.setAttribute('aria-hidden','false');
  openAddBtn.disabled = true;
  resetModalForm();
  setTimeout(()=>dName.focus(),80);
  document.addEventListener('keydown', onKeyDown);
}
function closeModal(){
  modalOverlay.style.display = 'none';
  modalOverlay.setAttribute('aria-hidden','true');
  openAddBtn.disabled = false;
  document.removeEventListener('keydown', onKeyDown);
}
openAddBtn.addEventListener('click', openModal);
modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) closeModal(); });
function onKeyDown(e){ if(e.key === 'Escape') closeModal(); }

function resetModalForm(){
  dName.value=''; dMobile.value=''; dEmail.value='';
  otpSection.classList.add('hidden'); otpInput.value=''; otpNote.textContent='';
  createSection.classList.add('hidden'); password.value=''; confirmPassword.value='';
  sendStatus.textContent=''; createStatus.textContent=''; otpVerified=false; createBtn.disabled=true;
  sendOtpBtn.disabled = true; verifyOtpBtn.disabled = true;
  if(resendTimer){ clearInterval(resendTimer); resendTimer=null; }
}

/* ========== NEW: inline validations ========== */
/* allow only letters and spaces in name field */
dName.addEventListener('input', (e) => {
  const cleaned = e.target.value.replace(/[^A-Za-z\s]/g, '');
  if (e.target.value !== cleaned) e.target.value = cleaned;
  checkCreateValidity();
});

/* allow only digits in mobile and limit to 10 digits */
dMobile.addEventListener('input', (e) => {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length > 10) v = v.slice(0,10);
  e.target.value = v;
  checkCreateValidity();
});

/* ================================================= */

filterInput.addEventListener('input', renderTable);

async function fetchList(){
  try{
    setStatus('Loading...');
    const res = await fetch(apiList + '?action=list');
    const j = await res.json();
    if(!j.success){ setStatus('Failed to load'); doctorsMemory = []; renderTable(); return; }
    doctorsMemory = j.doctors || [];
    renderTable();
    setStatus('');
  }catch(err){
    console.error(err);
    setStatus('Network error');
  }
}

function matchesFilter(item, q){
  if(!q) return true;
  q = q.toLowerCase();
  return ((item.name||'').toLowerCase().includes(q)
    || (item.email||'').toLowerCase().includes(q)
    || (item.mobile||'').toLowerCase().includes(q)
    || (item.role||'').toLowerCase().includes(q)
    || (item.created_at||'').toLowerCase().includes(q));
}

function renderTable(){
  const tb = tblBody;
  tb.innerHTML = '';
  const q = (filterInput.value||'').trim().toLowerCase();
  const list = (doctorsMemory||[]).filter(r => matchesFilter(r, q));
  if(list.length === 0){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="small" colspan="6">No doctors found</td>`;
    tb.appendChild(tr);
    return;
  }
  list.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td data-label="Name"><div class="cell-value">${escapeHtml(r.name)}</div></td>
       <td data-label="Email"><div class="cell-value">${escapeHtml(r.email)}</div></td>
       <td data-label="Mobile"><div class="cell-value">${escapeHtml(r.mobile||'')}</div></td>
       <td data-label="Role"><div class="cell-value">${escapeHtml(r.role||'')}</div></td>
       <td data-label="Created"><div class="cell-value">${escapeHtml(r.created_at||'')}</div></td>
       <td data-label="Actions"><button class="action-btn" data-id="${r.id}">Delete</button></td>`;
    tb.appendChild(tr);
  });

  tb.querySelectorAll('.action-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      if(!confirm('Delete doctor?')) return;
      const id = e.target.dataset.id;
      try{
        const res = await fetch(apiList + '?action=delete&id=' + encodeURIComponent(id));
        const jr = await res.json();
        if(jr.success){ showToast('Deleted'); fetchList(); }
        else showToast('Delete failed');
      }catch(err){ console.error(err); showToast('Delete failed'); }
    });
  });
}

/* OTP behaviors */
dEmail.addEventListener('input', () => {
  const email = (dEmail.value||'').trim().toLowerCase();
  sendStatus.textContent = '';
  otpSection.classList.add('hidden');
  otpInput.value = '';
  verifyOtpBtn.disabled = true;
  createSection.classList.add('hidden');
  otpVerified = false;
  createBtn.disabled = true;

  if(!validateEmail(email)){ sendOtpBtn.disabled = true; return; }
  sendOtpBtn.disabled = false;
});

otpInput.addEventListener('input', ()=> {
  verifyOtpBtn.disabled = !(otpInput.value||'').trim().length > 0;
});

sendOtpBtn.addEventListener('click', async ()=>{
  const email = (dEmail.value||'').trim().toLowerCase();
  if(!validateEmail(email)){ showToast('Enter a valid email'); return; }
  sendOtpBtn.disabled = true;
  sendStatus.textContent = 'Sending OTP...';
  try{
    const body = new URLSearchParams({ action:'send_otp', email: email, page: 'register' });
    const res = await fetch(signupEndpoint, { method:'POST', body, credentials:'include' });
    const j = await res.json();
    if(j.success){
      otpSection.classList.remove('hidden');
      otpSection.setAttribute('aria-hidden','false');
      sendStatus.textContent = 'OTP sent to email.';
      startResendCountdown();
    } else {
      sendStatus.textContent = j.message || 'Failed to send OTP';
      sendOtpBtn.disabled = false;
    }
  }catch(err){
    console.error(err);
    sendStatus.textContent = 'Network error';
    sendOtpBtn.disabled = false;
  }
});

verifyOtpBtn.addEventListener('click', async ()=>{
  const email = (dEmail.value||'').trim().toLowerCase();
  const otp = (otpInput.value||'').trim();
  if(!otp){ showToast('Enter OTP'); return; }
  verifyOtpBtn.disabled = true;
  otpNote.textContent = 'Verifying...';
  try{
    const body = new URLSearchParams({ action:'verify_otp', email: email, otp: otp });
    const res = await fetch(signupEndpoint, { method:'POST', body, credentials:'include' });
    const j = await res.json();
    if(j.success){
      otpVerified = true;
      otpSection.classList.add('hidden');
      createSection.classList.remove('hidden');
      createSection.setAttribute('aria-hidden','false');
      otpNote.textContent = 'Email verified — complete details below.';
      showToast('Email verified');
      checkCreateValidity();
    } else {
      otpNote.textContent = j.message || 'Invalid OTP';
      verifyOtpBtn.disabled = false;
    }
  }catch(err){
    console.error(err);
    otpNote.textContent = 'Network error';
    verifyOtpBtn.disabled = false;
  }
});

resendOtpBtn.addEventListener('click', ()=>{
  if(resendTimer){ showToast('Wait before resending'); return; }
  sendOtpBtn.click();
});

function startResendCountdown(){
  let sec = 60;
  resendTimer = setInterval(()=>{
    otpNote.textContent = `You can resend in ${sec}s`;
    sec--;
    if(sec < 0){
      clearInterval(resendTimer);
      resendTimer = null;
      otpNote.textContent = 'You can resend OTP now';
    }
  }, 1000);
}

/* Create doctor */
function checkCreateValidity(){
  const name = (dName.value||'').trim();
  const mobileVal = (dMobile.value||'').trim();
  const pass = (password.value||'');
  const cp = (confirmPassword.value||'');
  const nameValid = /^[A-Za-z\s]+$/.test(name);
  const valid = otpVerified && name && nameValid && validateMobile(mobileVal) && pass.length >= 6 && pass === cp;
  createBtn.disabled = !valid;
}
[dName, dMobile, password, confirmPassword].forEach(el=> el.addEventListener('input', checkCreateValidity));

createBtn.addEventListener('click', async ()=>{
  if(!otpVerified){ showToast('Please verify email first'); return; }
  const name = (dName.value||'').trim();
  const email = (dEmail.value||'').trim().toLowerCase();
  const mobileVal = (dMobile.value||'').trim();
  const pass = password.value || '';
  const cp = confirmPassword.value || '';

  if(!name) return showToast('Enter name');
  if(!/^[A-Za-z\s]+$/.test(name)) return showToast('Name must contain letters only');
  if(!validateMobile(mobileVal)) return showToast('Enter valid mobile');
  if(pass.length < 6) return showToast('Password min 6 chars');
  if(pass !== cp) return showToast('Passwords do not match');

  createBtn.disabled = true;
  createStatus.textContent = 'Creating...';
  try{
    const body = new URLSearchParams({
      action: 'register',
      name: name,
      mobile: mobileVal,
      email: email,
      password: pass,
      role: 'user'
    });
    const res = await fetch(signupEndpoint, { method:'POST', body, credentials:'include' });
    const j = await res.json();
    if(j.success){
      showToast('Doctor created');
      closeModal();
      fetchList();
    } else {
      createStatus.textContent = j.message || 'Create failed';
      createBtn.disabled = false;
    }
  }catch(err){
    console.error(err);
    createStatus.textContent = 'Network error';
    createBtn.disabled = false;
  } finally {
    setTimeout(()=>{ createStatus.textContent=''; }, 2000);
  }
});

/* Utilities */
function validateEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validateMobile(m){ return /^\d{10}$/.test(m); }

fetchList();
</script>
</body>
</html>
