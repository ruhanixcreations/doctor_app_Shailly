<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../header/header.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>Add New Patient</title>

<style>
:root{
  --primary-teal:#00A9A5;
  --primary-blue:#1a75bb;
  --text-dark:#2c3e50;
  --text-muted:#6c757d;
  --border-light:#e0e6ed;
  --bg-light:#f8f9fa;
  --bg-white:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f5f7fa;
  color:var(--text-dark);
  padding:20px;
  -webkit-font-smoothing:antialiased;
}

.card{
  max-width:940px;
  margin:20px auto;
  background:var(--bg-white);
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  border:1px solid var(--border-light);
  overflow:hidden;
}

.header{
  background:linear-gradient(135deg,var(--primary-teal) 0%,var(--primary-blue) 100%);
  padding:16px 24px;
  color:white;
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  width:42px;
  height:42px;
  border-radius:8px;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(10px);
  flex-shrink:0;
  font-size:20px;
}

.header-text{
  flex:1;
}

.header .title{
  font-size:18px;
  font-weight:700;
  margin-bottom:2px;
  line-height:1.2;
}

.header .subtitle{
  font-size:12px;
  opacity:0.9;
  font-weight:400;
}

.content{
  padding:24px;
}

h2{
  font-size:16px;
  color:var(--text-dark);
  margin-bottom:14px;
  font-weight:600;
}

label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
  font-size:14px;
  color:var(--text-dark);
}

input, select, button, textarea{
  width:100%;
  padding:11px 14px;
  border-radius:6px;
  border:1px solid var(--border-light);
  font-size:14px;
  transition:all 0.2s ease;
  font-family:inherit;
}

input:focus, select:focus, textarea:focus{
  border-color:var(--primary-teal);
  box-shadow:0 0 0 3px rgba(0,169,165,0.1);
  outline:none;
}

.inline-group{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.inline-item{
  flex:1 1 auto;
  min-width:80px;
}

.inline-item.w-small{
  width:110px;
  flex:0 0 110px;
}

.inline-item.w-medium{
  width:130px;
  flex:0 0 130px;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
  align-items:center;
}

.btn{
  height:44px;
  padding:10px 20px;
  border-radius:6px;
  border:none;
  background:linear-gradient(135deg,var(--primary-teal),var(--primary-blue));
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
  transition:all 0.2s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:auto;
}

.btn:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(0,169,165,0.25);
}

.btn:disabled{
  background:#d1d5db;
  color:#9ca3af;
  cursor:not-allowed;
}

.small{
  font-size:13px;
  color:var(--text-muted);
  margin-top:8px;
}

.thumbs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.thumb-wrap{
  position:relative;
  width:100px;
  height:100px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border-light);
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.05);
}

.thumb-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.remove-btn{
  position:absolute;
  top:4px;
  right:4px;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:none;
  border-radius:50%;
  width:22px;
  height:22px;
  cursor:pointer;
  font-size:14px;
  line-height:22px;
  padding:0;
}

#pdfName{
  margin-top:8px;
  font-size:14px;
  color:var(--primary-teal);
  font-weight:600;
}

.camera-actions-row{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:nowrap;
  align-items:center;
}

video{
  width:100%;
  border-radius:8px;
  background:#000;
  max-height:360px;
  display:block;
}

canvas{
  display:none;
}

.divider{
  border:0;
  border-top:1px solid var(--border-light);
  margin:20px 0;
}

@media (max-width:760px){
  body{
    padding:16px;
  }
  
  .header{
    padding:14px 18px;
  }
  
  .brand{
    width:38px;
    height:38px;
    font-size:18px;
  }
  
  .header .title{
    font-size:16px;
  }
  
  .header .subtitle{
    font-size:11px;
  }
  
  .content{
    padding:20px;
  }
  
  .inline-group{
    flex-direction:column;
  }
  
  .inline-item.w-small,.inline-item.w-medium{
    flex:1 1 100%;
    width:100%;
  }
  
  .camera-actions-row{
    flex-wrap:wrap;
  }
}

@media(max-width:420px){
  .header{
    padding:12px 16px;
  }
  
  .header .title{
    font-size:15px;
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>

<div class="card">
  <div class="header">
    <div class="brand">👤</div>
    <div class="header-text">
      <div class="title">Add New Patient</div>
      <div class="subtitle">Create patient record with photos</div>
    </div>
  </div>

  <div class="content">
    <form id="patientForm" enctype="multipart/form-data" autocomplete="off" novalidate>
      <input type="hidden" id="client_id" name="client_id">

      <h2>Patient Details</h2>
      <label for="patient_name">Patient Name *</label>
      <input id="patient_name" name="patient_name" required autocomplete="name" />

      <div class="inline-group">
        <div class="inline-item">
          <label for="mobile">Mobile *</label>
          <input id="mobile" name="mobile" inputmode="tel" required autocomplete="tel" />
        </div>

        <div class="inline-item w-small">
          <label for="age">Age *</label>
          <input id="age" name="age" type="number" min="0" required />
        </div>

        <div class="inline-item w-medium">
          <label for="weight">Weight (kg) *</label>
          <input id="weight" name="weight" type="number" step="0.1" min="0" required />
        </div>
      </div>

      <label for="doctor" style="margin-top:16px;">Doctor *</label>
      <select id="doctor" name="doctor" required>
        <option value="" disabled selected>Select Doctor</option>
      </select>

      <hr class="divider">

      <h2>Previous Records (Optional)</h2>
      <p class="small" style="margin-bottom:12px;color:var(--text-muted);">Capture patient's previous prescription and/or blood test report if available</p>
      
      <div class="inline-group">
        <div class="inline-item">
          <label for="previousPrescription">Previous Prescription (Optional)</label>
          <div style="margin-top:8px;">
            <button type="button" id="capturePrescriptionBtn" class="btn" style="width:100%;">
              <i class="fas fa-camera"></i> Capture Prescription
            </button>
          </div>
          <div id="prescriptionCameraSection" style="display:none; margin-top:12px;">
            <video id="prescriptionVideo" autoplay playsinline style="width:100%; max-width:400px; border-radius:8px; border:2px solid var(--border-light);"></video>
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button type="button" id="takePrescriptionPhoto" class="btn">
                <i class="fas fa-camera"></i> Take Photo
              </button>
              <button type="button" id="closePrescriptionCamera" class="btn secondary">
                <i class="fas fa-times"></i> Close
              </button>
            </div>
          </div>
          <div id="prescriptionPreview" class="file-preview"></div>
          <input type="file" id="previousPrescription" name="previous_prescription" accept="image/*,application/pdf" style="display:none;">
        </div>

        <div class="inline-item">
          <label for="previousBloodTest">Previous Blood Test (Optional)</label>
          <div style="margin-top:8px;">
            <button type="button" id="captureBloodTestBtn" class="btn" style="width:100%;">
              <i class="fas fa-camera"></i> Capture Blood Test
            </button>
          </div>
          <div id="bloodTestCameraSection" style="display:none; margin-top:12px;">
            <video id="bloodTestVideo" autoplay playsinline style="width:100%; max-width:400px; border-radius:8px; border:2px solid var(--border-light);"></video>
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button type="button" id="takeBloodTestPhoto" class="btn">
                <i class="fas fa-camera"></i> Take Photo
              </button>
              <button type="button" id="closeBloodTestCamera" class="btn secondary">
                <i class="fas fa-times"></i> Close
              </button>
            </div>
          </div>
          <div id="bloodTestPreview" class="file-preview"></div>
          <input type="file" id="previousBloodTest" name="previous_blood_test" accept="image/*,application/pdf" style="display:none;">
        </div>
      </div>

      <hr class="divider">
      
      <h2>Camera (capture multiple photos)</h2>
      <div class="controls" id="cameraControls">
        <button type="button" id="openCamera" class="btn">Open Camera</button>
      </div>

      <div style="margin-top:12px;">
        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas"></canvas>
      </div>

      <div id="cameraActionButtons" class="camera-actions-row" style="display:none;">
        <button type="button" id="takePhoto" class="btn" disabled>Take Photo</button>
        <button type="button" id="stopCamera" class="btn" disabled>Stop Camera</button>
      </div>

      <hr class="divider">

      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
        <div class="small">Captured files (click ✕ to remove)</div>
        <div class="controls" style="margin-top:0;">
          <button type="button" id="createPdf" class="btn" disabled>Create PDF from Photos</button>
        </div>
      </div>

      <div id="thumbs" class="thumbs"></div>
      <div id="pdfName" style="display:none;"></div>

      <div style="margin-top:20px;" class="controls">
        <button type="submit" id="submitBtn" class="btn" disabled>💾 Save & Submit</button>
        <input type="file" id="fileUpload" style="display:none;" accept="image/*,application/pdf" multiple>
      </div>

      <div id="status" class="small" style="margin-top:10px;"></div>
    </form>
  </div>
</div>

<script>
/* Check Authentication from localStorage */
function checkAuth(){
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  
  // If isLoggedIn is null, undefined, false, or 'false', redirect to signin
  if(!isLoggedIn || isLoggedIn === 'false' || isLoggedIn === 'null'){
    window.location.href = '../signin/signin.html';
    return false;
  }
  
  return true;
}

// Run auth check immediately
if(!checkAuth()){
  throw new Error('Unauthorized access');
}

(async function(){
  const { jsPDF } = window.jspdf;

  // Elements
  const clientInput = document.getElementById('client_id');
  const form = document.getElementById('patientForm');
  const nameInput = document.getElementById('patient_name');
  const mobileInput = document.getElementById('mobile');
  const ageInput = document.getElementById('age');
  const weightInput = document.getElementById('weight');
  const doctorSelect = document.getElementById('doctor'); 

  const openCameraBtn = document.getElementById('openCamera');
  const takePhotoBtn = document.getElementById('takePhoto');
  const stopCameraBtn = document.getElementById('stopCamera');
  const createPdfBtn = document.getElementById('createPdf');
  const submitBtn = document.getElementById('submitBtn');

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const cameraActionButtons = document.getElementById('cameraActionButtons');
  const thumbsEl = document.getElementById('thumbs');
  const pdfNameEl = document.getElementById('pdfName');
  const statusEl = document.getElementById('status');
  
  // Previous records upload elements
  const capturePrescriptionBtn = document.getElementById('capturePrescriptionBtn');
  const captureBloodTestBtn = document.getElementById('captureBloodTestBtn');
  const previousPrescriptionInput = document.getElementById('previousPrescription');
  const previousBloodTestInput = document.getElementById('previousBloodTest');
  const prescriptionPreview = document.getElementById('prescriptionPreview');
  const bloodTestPreview = document.getElementById('bloodTestPreview');
  
  const prescriptionCameraSection = document.getElementById('prescriptionCameraSection');
  const prescriptionVideo = document.getElementById('prescriptionVideo');
  const takePrescriptionPhoto = document.getElementById('takePrescriptionPhoto');
  const closePrescriptionCamera = document.getElementById('closePrescriptionCamera');
  
  const bloodTestCameraSection = document.getElementById('bloodTestCameraSection');
  const bloodTestVideo = document.getElementById('bloodTestVideo');
  const takeBloodTestPhoto = document.getElementById('takeBloodTestPhoto');
  const closeBloodTestCamera = document.getElementById('closeBloodTestCamera');

  let stream = null;
  let filesArray = [];
  let prescriptionStream = null;
  let bloodTestStream = null;
  
  // ======== PREVIOUS RECORDS CAMERA HANDLERS ========
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  
  function showFilePreview(previewEl, file, inputEl) {
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const isImage = file.type.startsWith('image/');
    
    let previewContent = '';
    if (isImage) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewEl.innerHTML = `
          <div class="file-preview-content">
            <img src="${e.target.result}" style="width:100px;height:100px;object-fit:cover;border-radius:6px;border:2px solid var(--border-light);">
            <div class="file-preview-info">
              <div class="file-preview-name">${file.name}</div>
              <div class="file-preview-size">${formatFileSize(file.size)}</div>
            </div>
            <button type="button" class="file-preview-remove">Remove</button>
          </div>
        `;
        previewEl.classList.add('has-file');
        
        previewEl.querySelector('.file-preview-remove').addEventListener('click', () => {
          inputEl.value = '';
          previewEl.classList.remove('has-file');
          previewEl.innerHTML = '';
        });
      };
      reader.readAsDataURL(file);
    } else {
      const icon = '<i class="fas fa-file-pdf file-preview-icon"></i>';
      previewEl.innerHTML = `
        <div class="file-preview-content">
          ${icon}
          <div class="file-preview-info">
            <div class="file-preview-name">${file.name}</div>
            <div class="file-preview-size">${formatFileSize(file.size)}</div>
          </div>
          <button type="button" class="file-preview-remove">Remove</button>
        </div>
      `;
      previewEl.classList.add('has-file');
      
      previewEl.querySelector('.file-preview-remove').addEventListener('click', () => {
        inputEl.value = '';
        previewEl.classList.remove('has-file');
        previewEl.innerHTML = '';
      });
    }
  }
  
  // Prescription Camera Handlers
  capturePrescriptionBtn.addEventListener('click', async () => {
    try {
      prescriptionStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment' }, 
        audio: false 
      });
      prescriptionVideo.srcObject = prescriptionStream;
      prescriptionCameraSection.style.display = 'block';
      capturePrescriptionBtn.style.display = 'none';
    } catch (err) {
      alert('Camera access denied or unavailable');
      console.error(err);
    }
  });
  
  takePrescriptionPhoto.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = prescriptionVideo.videoWidth;
    canvas.height = prescriptionVideo.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(prescriptionVideo, 0, 0);
    
    canvas.toBlob((blob) => {
      const file = new File([blob], 'prescription_' + Date.now() + '.jpg', { type: 'image/jpeg' });
      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      previousPrescriptionInput.files = dataTransfer.files;
      showFilePreview(prescriptionPreview, file, previousPrescriptionInput);
      
      // Stop camera
      if (prescriptionStream) {
        prescriptionStream.getTracks().forEach(track => track.stop());
      }
      prescriptionCameraSection.style.display = 'none';
      capturePrescriptionBtn.style.display = 'block';
    }, 'image/jpeg', 0.9);
  });
  
  closePrescriptionCamera.addEventListener('click', () => {
    if (prescriptionStream) {
      prescriptionStream.getTracks().forEach(track => track.stop());
    }
    prescriptionCameraSection.style.display = 'none';
    capturePrescriptionBtn.style.display = 'block';
  });
  
  // Blood Test Camera Handlers
  captureBloodTestBtn.addEventListener('click', async () => {
    try {
      bloodTestStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment' }, 
        audio: false 
      });
      bloodTestVideo.srcObject = bloodTestStream;
      bloodTestCameraSection.style.display = 'block';
      captureBloodTestBtn.style.display = 'none';
    } catch (err) {
      alert('Camera access denied or unavailable');
      console.error(err);
    }
  });
  
  takeBloodTestPhoto.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = bloodTestVideo.videoWidth;
    canvas.height = bloodTestVideo.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bloodTestVideo, 0, 0);
    
    canvas.toBlob((blob) => {
      const file = new File([blob], 'blood_test_' + Date.now() + '.jpg', { type: 'image/jpeg' });
      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      previousBloodTestInput.files = dataTransfer.files;
      showFilePreview(bloodTestPreview, file, previousBloodTestInput);
      
      // Stop camera
      if (bloodTestStream) {
        bloodTestStream.getTracks().forEach(track => track.stop());
      }
      bloodTestCameraSection.style.display = 'none';
      captureBloodTestBtn.style.display = 'block';
    }, 'image/jpeg', 0.9);
  });
  
  closeBloodTestCamera.addEventListener('click', () => {
    if (bloodTestStream) {
      bloodTestStream.getTracks().forEach(track => track.stop());
    }
    bloodTestCameraSection.style.display = 'none';
    captureBloodTestBtn.style.display = 'block';
  });

  // Load client id and fetch doctors
  document.addEventListener('DOMContentLoaded', ()=> {
    clientInput.value = localStorage.getItem('client_id') || '';
    fetchDoctors(); 
    updateControls();
  });

  async function fetchDoctors(){
    try {
      const res = await fetch('add_new_patient.php?action=get_doctors');
      const json = await res.json();
      
      if (json.success && Array.isArray(json.doctors)){
        json.doctors.forEach(doctor => {
          const option = document.createElement('option');
          option.value = doctor.id;
          option.textContent = `${doctor.name} (Client ID: ${doctor.client_id})`; 
          doctorSelect.appendChild(option);
        });
      } else {
        console.error('Failed to load doctors:', json.message || 'Unknown error');
        statusEl.textContent = 'Warning: Failed to load doctors list.';
      }
    } catch(err) {
      console.error('Fetch error:', err);
      statusEl.textContent = 'Error: Could not connect to the server to fetch doctor list.';
    }
  }

  // Input validation
  nameInput.addEventListener('keypress', (e) => {
    const char = String.fromCharCode(e.which || e.keyCode);
    if (!/^[a-zA-Z\s]$/.test(char)) e.preventDefault();
  });
  nameInput.addEventListener('input', ()=> {
    const cleaned = nameInput.value.replace(/[^a-zA-Z\s]/g, '');
    if (nameInput.value !== cleaned) nameInput.value = cleaned;
    updateControls();
  });

  mobileInput.addEventListener('keypress', (e) => {
    const char = String.fromCharCode(e.which || e.keyCode);
    if (!/^\d$/.test(char) || mobileInput.value.length >= 10) e.preventDefault();
  });
  mobileInput.addEventListener('input', ()=> {
    const cleaned = mobileInput.value.replace(/\D/g, '').slice(0,10);
    if (mobileInput.value !== cleaned) mobileInput.value = cleaned;
    updateControls();
  });

  [ageInput, weightInput].forEach(el => el.addEventListener('input', updateControls));
  doctorSelect.addEventListener('change', updateControls); 

  // Utility functions
  function dataURLtoBlob(dataurl){
    const arr = dataurl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    const u8 = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  function readFileAsDataURL(file){
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = e => res(e.target.result);
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  function loadImage(dataUrl){
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = dataUrl;
    });
  }

  function renderThumbs(){
    thumbsEl.innerHTML = '';
    filesArray.forEach((item, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      if (item.isPdf){
        wrap.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
        wrap.style.display = 'flex';
        wrap.style.alignItems = 'center';
        wrap.style.justifyContent = 'center';
        const label = document.createElement('div');
        label.style.textAlign = 'center';
        label.style.color = 'white';
        label.innerHTML = `<i class="fas fa-file-pdf" style="font-size:48px;margin-bottom:8px;"></i><div style="font-size:11px;margin-top:6px;font-weight:600;">${item.file.name || 'file.pdf'}</div>`;
        wrap.appendChild(label);
      } else {
        const img = document.createElement('img');
        img.src = item.dataUrl;
        img.alt = item.file.name || ('img'+idx);
        wrap.appendChild(img);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'remove-btn';
      btn.innerText = '✕';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        filesArray.splice(idx,1);
        renderThumbs();
        updateControls();
      });
      wrap.appendChild(btn);
      thumbsEl.appendChild(wrap);
    });
  }

  function addFile(file, dataUrl = null){
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    filesArray.push({ file, dataUrl, isPdf });
    renderThumbs();
  }

  // Validation
  function isNameValid(){ return /^[A-Za-z\s]+$/.test(nameInput.value.trim()); }
  function isMobileValid(){ return /^\d{10}$/.test(mobileInput.value.trim()); }
  function isAgeValid(){ return ageInput.value !== '' && Number(ageInput.value) >= 0; }
  function isWeightValid(){ return weightInput.value !== '' && Number(weightInput.value) >= 0; }
  function isDoctorValid(){ return doctorSelect.value !== ''; } 
  function hasCapturedFiles(){ return filesArray.length > 0; }

  function updateControls(){
    createPdfBtn.disabled = filesArray.length === 0;
    const allOk = isNameValid() && isMobileValid() && isAgeValid() && isWeightValid() && isDoctorValid() && hasCapturedFiles();
    submitBtn.disabled = !allOk;

    if (!isNameValid() && nameInput.value.length > 0) {
      nameInput.style.borderColor = '#dc3545';
    } else {
      nameInput.style.borderColor = '';
    }
    if (!isMobileValid() && mobileInput.value.length > 0) {
      mobileInput.style.borderColor = '#dc3545';
    } else {
      mobileInput.style.borderColor = '';
    }
    if (!isDoctorValid() && doctorSelect.value !== '') {
      doctorSelect.style.borderColor = '#dc3545';
    } else {
      doctorSelect.style.borderColor = '';
    }
  }

  // Camera handlers
  openCameraBtn.addEventListener('click', async () => {
    if (!stream) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        video.style.display = 'block';
        cameraActionButtons.style.display = 'flex';
        takePhotoBtn.disabled = false;
        stopCameraBtn.disabled = false;
        openCameraBtn.style.display = 'none';
      } catch (err) {
        alert('Could not open camera: ' + (err && err.message ? err.message : err));
      }
    }
  });

  takePhotoBtn.addEventListener('click', () => {
    if (!stream) return;
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 720;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const blob = dataURLtoBlob(dataUrl);
    const file = new File([blob], 'capture_' + Date.now() + '.jpg', { type: 'image/jpeg' });
    addFile(file, dataUrl);
    statusEl.textContent = `Captured photo (${filesArray.length} total)`;
    updateControls();
  });

  stopCameraBtn.addEventListener('click', () => {
    if (stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.style.display = 'none';
      cameraActionButtons.style.display = 'none';
      takePhotoBtn.disabled = true;
      stopCameraBtn.disabled = true;
      openCameraBtn.style.display = 'block';
    }
  });

  // Create PDF
  createPdfBtn.addEventListener('click', async () => {
    const images = filesArray.filter(f => !f.isPdf);
    if (images.length === 0) {
      alert('No images to create PDF');
      return;
    }
    statusEl.textContent = 'Generating PDF...';
    try {
      const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
      for (let i = 0; i < images.length; i++){
        const dataUrl = images[i].dataUrl || await readFileAsDataURL(images[i].file);
        const img = await loadImage(dataUrl);
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        let iw = img.width, ih = img.height;
        const ratio = Math.min(pw/iw, ph/ih);
        iw *= ratio; ih *= ratio;
        pdf.addImage(dataUrl, 'JPEG', (pw - iw)/2, (ph - ih)/2, iw, ih);
        if (i < images.length - 1) pdf.addPage();
      }
      const blob = new Blob([pdf.output('arraybuffer')], { type: 'application/pdf' });
      const pdfFile = new File([blob], 'report_' + Date.now() + '.pdf', { type: 'application/pdf' });

      filesArray = filesArray.filter(f => !f.isPdf);
      const pdfDataUrl = URL.createObjectURL(blob);
      filesArray.push({ file: pdfFile, dataUrl: pdfDataUrl, isPdf: true });
      renderThumbs();
      updateControls();
      
      // Create a URL for the PDF blob and display a link to view it
      pdfNameEl.style.display = 'block';
      pdfNameEl.innerHTML = `<i class="fas fa-file-pdf" style="color:#e74c3c;font-size:18px;margin-right:8px;"></i><strong>PDF Created:</strong> ${pdfFile.name} (${images.length} page(s)) - <a href="${pdfDataUrl}" target="_blank" style="color: var(--primary-teal); text-decoration: underline; font-weight: 600;"><i class="fas fa-eye"></i> View PDF</a>`;
      statusEl.textContent = 'PDF generated.';
    } catch (err) {
      alert('PDF generation failed: ' + (err && err.message ? err.message : err));
      statusEl.textContent = '';
    }
  });

  // Form submit
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    updateControls();
    if (!(isNameValid() && isMobileValid() && isAgeValid() && isWeightValid() && isDoctorValid() && hasCapturedFiles())){
      alert('Please fill all required fields correctly and capture at least one photo or PDF.');
      return;
    }

    if (!clientInput.value) {
      clientInput.value = '';
    }

    const formData = new FormData();
    formData.append('client_id', clientInput.value);
    formData.append('patient_name', nameInput.value.trim());
    formData.append('mobile', mobileInput.value.trim());
    formData.append('age', ageInput.value);
    formData.append('weight', weightInput.value);
    formData.append('doctor', doctorSelect.value.trim()); 

    const pdfItem = filesArray.find(f => f.isPdf);
    if (pdfItem){
      formData.append('report_pdf', pdfItem.file, pdfItem.file.name);
    } else {
      filesArray.forEach((f, idx) => formData.append('files[]', f.file, f.file.name));
    }

    statusEl.textContent = 'Uploading...';
    submitBtn.disabled = true;
    try {
      const res = await fetch('add_new_patient.php', { method: 'POST', body: formData });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'Server error');
      statusEl.textContent = 'Saved: ' + (json.message || 'OK') + (json.patient_id ? (' (ID: '+json.patient_id+')') : '');
      filesArray = [];
      renderThumbs();
      pdfNameEl.style.display = 'none';
      form.reset();
      doctorSelect.value = ''; 
      if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; video.style.display = 'none'; cameraActionButtons.style.display = 'none'; }
      updateControls();
    } catch (err) {
      statusEl.textContent = 'Upload failed: ' + (err && err.message ? err.message : err);
    } finally {
      submitBtn.disabled = false;
    }
  });

  updateControls();

})();
</script>
<script src="../header/header.js"></script>

<!-- Session Monitoring for Immediate Logout -->
<script>
(function() {
  let sessionCheckInterval = null;
  let isLoggingOut = false;
  
  const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
  if (!isLoggedIn) return;
  
  sessionCheckInterval = setInterval(() => {
    if (isLoggingOut) return;
    
    fetch("../check_session.php", { credentials: "include" })
      .then(res => res.json())
      .then(data => {
        if (!data.success && !isLoggingOut) {
          isLoggingOut = true;
          clearInterval(sessionCheckInterval);
          localStorage.clear();
          alert(data.message || 'Your session has expired');
          window.location.href = '../signin/signin.html';
        }
      })
      .catch(err => console.error('Session check error:', err));
  }, 3000);
})();
</script>
