<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../header/header.css">
<style>
  :root{
    --navy:#0b2340; --sea:#6f9ef0; --sea-dark:#183159; --muted:#6f7f8f;
    --card-bg:#fff; --radius:14px; --box-width:780px; --control-height:50px;
    --input-shadow: 0 14px 40px rgba(13,30,60,0.12);
    --input-focus-shadow: 0 18px 50px rgba(25,72,160,0.18);
    --btn-shadow: 0 14px 34px rgba(24,57,89,0.16);
    --popup-bg: #fff8f6;
    --popup-border: rgba(221,85,72,0.12);
    --popup-backdrop: rgba(6,12,24,0.36);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
body.app-shell{
    font-family:"Inter","Poppins",system-ui,Arial,sans-serif;
    background:linear-gradient(180deg,#e9f3ff 0%,#f7fbff 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:28px; padding-top:140px; -webkit-font-smoothing:antialiased; color:#071123;
  }

  .wrap{width:100%;max-width:var(--box-width);position:relative}
  .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 22px 60px rgba(9,30,66,0.10);
    border:1px solid rgba(16,42,83,0.06); overflow:visible; position:relative;}
  .card-header{
    background:linear-gradient(90deg,var(--navy) 0%,var(--sea-dark) 100%);
    padding:20px 26px;color:#fff;display:flex;gap:16px;align-items:center;
    border-top-left-radius:var(--radius); border-top-right-radius:var(--radius);
  }
  .brand{
    width:56px;height:56px;border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.03));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;
    font-size:18px; box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  .card-header .title{
    font-size:22px; font-weight:800; line-height:1; letter-spacing:0.2px;
    color:#ffffff; text-shadow:0 1px 0 rgba(0,0,0,0.12);
  }
  .card-header .subtitle{
    font-size:13px; color:rgba(255,255,255,0.9); margin-top:4px; font-weight:600;
  }

  .card-body{padding:26px;background:linear-gradient(180deg,#fff,#fbfdff);position:relative;min-height:260px}
  h1{font-size:24px;margin-bottom:8px;color:#071123;font-weight:800; line-height:1.1}
  p.lead{font-size:15px;color:var(--muted);margin-bottom:12px}
  .choices-row{display:flex;gap:12px;align-items:center;margin-top:12px}
  .radio-item{
    display:inline-flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
    border:1px solid rgba(16,42,83,0.06);background:#fff;cursor:pointer; min-width:220px;
    transition:box-shadow .12s,transform .08s;
  }
  .radio-item:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(8,18,40,0.06); }
  .radio-item input{accent-color:var(--sea-dark); width:20px; height:20px;}
  .radio-item strong{font-size:15px}

  input, button { font-family:inherit; outline: none; font-size:15px; transition:box-shadow .12s, border-color .12s, transform .06s; }
  input::placeholder { color: rgba(11,18,35,0.45); }
  input[type="email"], input[type="password"], input[type="text"], input[type="tel"]{
    width:100%; padding:12px 14px; height:var(--control-height); border-radius:12px;
    border:1px solid rgba(16,42,83,0.08); font-size:15px; line-height:1.2;
    background:linear-gradient(180deg,#ffffff,#fbfdff);
    box-shadow: var(--input-shadow);
  }
  input[type="email"], input[type="password"], input[type="text"], input[type="tel"]{
    border-color: rgba(8,18,33,0.10);
  }
  input:focus{
    border-color: var(--sea-dark);
    box-shadow: var(--input-focus-shadow);
    transform: translateY(-1px);
  }

  .btn{
    height:var(--control-height); padding:12px 16px; border-radius:12px; border:none;
    background:linear-gradient(90deg,var(--sea),var(--sea-dark)); color:#fff; font-weight:800; cursor:pointer;
    font-size:15px; box-shadow: var(--btn-shadow);
  }
  .btn:active{ transform: translateY(1px) scale(0.998); }
  .btn.disabled{background: gray;          /* button background */
  color: #fff;   opacity:.6; cursor:not-allowed; box-shadow: none}
  .inline-error{color:#ef4444;font-size:14px;margin-top:8px}
  .hint{font-size:14px;color:var(--muted)}

  .form-panel{margin-top:18px; display:block; border-radius:12px; padding:16px; background:linear-gradient(180deg,#fbfdff,#ffffff); border:1px solid rgba(16,42,83,0.03)}
  .row{display:flex; gap:10px; align-items:center}
  .right { margin-left:auto; }

  .small-note{font-size:13px;color:var(--muted); margin-top:10px}
  .visually-hidden{position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px, 1px, 1px, 1px); white-space:nowrap;}

  .signup-row { margin-top:16px; text-align:center; font-size:15px; color:var(--muted); }

  /* server popup backdrop inside card */
  .server-popup-backdrop {
    position:absolute;
    inset:0;
    background: var(--popup-backdrop);
    display:none;
    z-index:75;
    border-radius: var(--radius);
  }
  .server-popup-backdrop.show { display:block; }

  /* BIG centered popup */
  .server-popup {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:82%;
    max-width:520px;
    min-width:320px;
    background: var(--popup-bg);
    border:1px solid var(--popup-border);
    border-radius:14px;
    padding:20px 20px;
    box-shadow: 0 30px 80px rgba(8,18,40,0.18);
    display:none;
    z-index:80;
  }
  .server-popup.show { display:block; }
  .server-popup h4{margin:0 0 10px 0; font-size:18px; color:#d14836; font-weight:800}
  .server-popup p{margin:0 0 12px 0; color:#2d2d2d; font-size:15px; line-height:1.3}
  .server-popup .popup-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:6px}
  .server-popup .btn-secondary{
    background:transparent; border:1px solid rgba(16,42,83,0.06); color:var(--muted); padding:10px 14px; border-radius:10px; cursor:pointer;
  }

  /* MOBILE / SMALL SCREENS */
  @media(max-width:840px){
    html,body{height:100%}
    body{ padding:12px; }
    :root{
      --box-width:calc(100% - 18px);
      --control-height:56px;
      --input-shadow: 0 18px 46px rgba(13,30,60,0.14);
      --input-focus-shadow: 0 24px 60px rgba(25,72,160,0.20);
      --btn-shadow: 0 16px 40px rgba(24,57,89,0.18);
    }
    .wrap{max-width:var(--box-width);}
    .card-body{padding:18px;}
    .card-header{padding:16px 18px;}
    .brand{width:48px;height:48px;font-size:16px}
    .card-header .title{font-size:20px}
    h1{font-size:20px}
    .choices-row{flex-direction:row; gap:8px; justify-content:space-between; align-items:center}
    .radio-item{flex:1; min-width:0; padding:10px; font-size:14px}
    .form-panel{padding:14px;}
    input[type="email"], input[type="password"], input[type="text"], input[type="tel"]{height:var(--control-height); padding:12px;}
    .btn{height:var(--control-height); font-size:15px;}
    .signup-row{margin-top:14px; font-size:14px}

    .server-popup { width:90%; max-width:520px; padding:18px; left:50%; top:46%; transform:translate(-50%,-46%); min-width:260px; }
  }

  @media(max-width:420px){
    :root{ --box-width:calc(100% - 12px); --control-height:58px; }
    .choices-row{flex-direction:column; gap:10px}
    .radio-item{width:100%}
    .card-header .title{font-size:18px}
    h1{font-size:18px}
    .server-popup { width:92%; left:50%; top:48%; transform:translate(-50%,-48%); }
  }
</style>
</head>
<body>

  <div class="wrap" role="main" aria-labelledby="signInHeading">
    <div class="card" role="region" aria-label="Sign in card" id="cardRoot">
      <div class="card-header">
        <div class="brand">SI</div>
        <div>
          <div class="title">Sign In</div>
          <div class="subtitle">Secure sign-in with password or email OTP</div>
        </div>
      </div>

      <!-- backdrop and server popup (centered and larger) -->
      <div id="serverPopupBackdrop" class="server-popup-backdrop" aria-hidden="true"></div>

      <div id="serverPopup" class="server-popup" role="alertdialog" aria-modal="true" aria-labelledby="serverPopupTitle" aria-describedby="serverPopupDesc">
        <h4 id="serverPopupTitle">Notice</h4>
        <p id="serverPopupDesc">User not registered</p>
        <div class="popup-actions">
          <button id="serverPopupOk" class="btn">OK</button>
        </div>
      </div>

      <div class="card-body">
        <h1 id="signInHeading">Welcome</h1>
        <p class="lead">Choose how you'd like to sign in</p>

        <!-- radio choices (default: otp) -->
        <div class="choices-row" role="radiogroup" aria-label="Sign in mode">
          <label class="radio-item" for="mode-otp">
            <input id="mode-otp" name="signinMode" type="radio" value="otp" checked>
            <div>
              <strong>Sign in with Email (OTP)</strong><br>
              <small style="color:var(--muted)">Get a one-time code to your email</small>
            </div>
          </label>

          <label class="radio-item" for="mode-password">
            <input id="mode-password" name="signinMode" type="radio" value="password">
            <div>
              <strong>Sign in with Password</strong><br>
              <small style="color:var(--muted)">Enter your email and password</small>
            </div>
          </label>
        </div>

        <!-- Inline form panel (shows fields depending on mode) -->
        <div id="formPanel" class="form-panel" aria-live="polite">
          <!-- shared email -->
          <div>
            <label class="visually-hidden" for="email">Email</label>
            <input id="email" type="email" placeholder="Enter email" autocomplete="email" />
            <div id="emailError" class="inline-error" style="display:none"></div>
          </div>

          <!-- password area -->
          <div id="passwordArea" style="display:none; margin-top:14px;">
            <div>
              <label class="visually-hidden" for="password">Password</label>
              <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
              <div id="passwordError" class="inline-error" style="display:none"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px">
              <button id="signinBtn" class="btn" disabled>Sign In</button>
            </div>
          </div>

          <!-- OTP area -->
          <div id="otpArea" style="margin-top:14px;">
            <div style="display:flex; justify-content:flex-end">
              <button id="sendOtpBtn" class="btn">Send OTP to Verify Email-Id</button>
            </div>
            <div id="sendStatus" class="hint" style="display:none; margin-top:10px"></div>

            <div id="otpBlock" style="display:none; margin-top:12px">
              <div>
                <label class="visually-hidden" for="otp">OTP</label>
                <input id="otp" type="text" placeholder="Enter OTP" inputmode="numeric" />
                <div id="otpError" class="inline-error" style="display:none"></div>
              </div>
              <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px">
                <button id="verifyOtpBtn" class="btn" disabled>Verify OTP</button>
              </div>
              <div id="resendRow" style="display:none; text-align:center; margin-top:10px" class="small-note">
                Didn't receive OTP? <span id="resendBtn" style="color:var(--sea-dark); cursor:pointer; font-weight:700">Resend</span>
              </div>
            </div>
          </div>

          <div id="successMsg" class="hint" style="display:none; color:green; margin-top:12px"></div>
        </div>

        <!-- moved sign-up link below the input panel -->
        <div class="signup-row">
          Don't have an account? <a href="/doctor_app/signup/signup.html" style="color:var(--sea-dark); font-weight:700">Sign up</a>
        </div>

      </div>
    </div>
  </div>

<script defer src="../header/header.js" data-header-root="../header" data-app-root=".."></script>
<script>
/* Elements */
const modeOtp = document.getElementById('mode-otp');
const modePassword = document.getElementById('mode-password');

const email = document.getElementById('email');
const emailError = document.getElementById('emailError');

const passwordArea = document.getElementById('passwordArea');
const password = document.getElementById('password');
const passwordError = document.getElementById('passwordError');
const signinBtn = document.getElementById('signinBtn');

const otpArea = document.getElementById('otpArea');
const sendOtpBtn = document.getElementById('sendOtpBtn');
const sendStatus = document.getElementById('sendStatus');
const otpBlock = document.getElementById('otpBlock');
const otp = document.getElementById('otp');
const verifyOtpBtn = document.getElementById('verifyOtpBtn');
const resendRow = document.getElementById('resendRow');
const resendBtn = document.getElementById('resendBtn');

const successMsg = document.getElementById('successMsg');

/* server popup elements */
const serverPopup = document.getElementById('serverPopup');
const serverPopupBackdrop = document.getElementById('serverPopupBackdrop');
const serverPopupDesc = document.getElementById('serverPopupDesc');
const serverPopupOk = document.getElementById('serverPopupOk');

let currentMode = 'otp'; // defaults to otp
let otpTimer = null;
let secondsLeft = 60;

/* helpers */
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function show(el){ el.style.display = 'block'; }
function hide(el){ el.style.display = 'none'; }

/* show server popup with message (no native alert) */
function showServerPopup(title, message){
  document.getElementById('serverPopupTitle').textContent = title || 'Notice';
  serverPopupDesc.textContent = message || '';
  serverPopup.classList.add('show');
  serverPopupBackdrop.classList.add('show');
  serverPopup.setAttribute('aria-hidden', 'false');
  serverPopupOk.focus();
}
/* hide popup */
function hideServerPopup(){
  serverPopup.classList.remove('show');
  serverPopupBackdrop.classList.remove('show');
  serverPopup.setAttribute('aria-hidden', 'true');
}

/* initialize UI based on default */
function updateModeUI(){
  currentMode = modeOtp.checked ? 'otp' : 'password';
  if(currentMode === 'password'){
    show(passwordArea);
    hide(otpArea);
    hide(sendStatus);
    hide(otpBlock);
    hide(successMsg);
    signinBtn.disabled = true;
    signinBtn.classList.add('disabled');
  } else {
    hide(passwordArea);
    show(otpArea);
    sendOtpBtn.disabled = false;
    sendOtpBtn.classList.remove('disabled');
    hide(sendStatus);
    hide(otpBlock);
    hide(successMsg);
  }
}
modeOtp.addEventListener('change', updateModeUI);
modePassword.addEventListener('change', updateModeUI);
updateModeUI(); // run once on load

/* password flow validation */
email.addEventListener('input', ()=> { emailError.style.display='none'; if(currentMode==='password') validatePasswordForm(); });
password.addEventListener('input', ()=> { passwordError.style.display='none'; validatePasswordForm(); });

function validatePasswordForm(){
  const e = email.value.trim();
  const p = password.value;
  const ok = isValidEmail(e) && p.trim().length >= 6;
  signinBtn.disabled = !ok;
  signinBtn.classList.toggle('disabled', !ok);
}

/* password sign-in */
signinBtn.addEventListener('click', async ()=>{
  const e = email.value.trim().toLowerCase();
  const p = password.value;
  if(!isValidEmail(e)){ emailError.style.display='block'; emailError.textContent='Enter valid email'; return; }
  if(!p || p.length < 6){ passwordError.style.display='block'; passwordError.textContent='Enter password (min 6 chars)'; return; }

  signinBtn.disabled = true; signinBtn.textContent = 'Signing...';
  try {
    const resp = await fetch('signin.php', {
      method:'POST',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      credentials:'include',
      body: new URLSearchParams({ action:'login_password', email: e, password: p })
    });
    const data = await resp.json();
    if(data.success){
      if(data.client_id) localStorage.setItem('client_id', data.client_id);
      if(data.user_id) localStorage.setItem('user_id', data.user_id);
      if(data.role) localStorage.setItem('role', data.role);
      if(data.name) localStorage.setItem('userName', data.name);
      if(data.email) localStorage.setItem('signedInUserEmail', data.email);

      successMsg.style.display = 'block'; successMsg.textContent = data.message || 'Signed in';
      const redirect = data.redirect || '/doctor_app/dashboard/dashboard.html';
      setTimeout(()=> window.location.href = redirect, 250);
    } else {
      if(data.message && /register|not registered|not found/i.test(data.message)){
        showServerPopup('User not registered', data.message);
      } else {
        passwordError.style.display = 'block'; passwordError.textContent = data.message || 'Invalid credentials';
      }
      signinBtn.disabled = false; signinBtn.textContent = 'Sign In';
      signinBtn.classList.remove('disabled');
    }
  } catch(err){
    console.error(err);
    passwordError.style.display = 'block'; passwordError.textContent = 'Something went wrong';
    signinBtn.disabled = false; signinBtn.textContent = 'Sign In';
  }
});

/* OTP flow */
sendOtpBtn.addEventListener('click', async ()=>{
  const e = email.value.trim().toLowerCase();
  if(!isValidEmail(e)){ emailError.style.display='block'; emailError.textContent='Enter valid email'; return; }
  emailError.style.display='none';

  sendOtpBtn.disabled = true; sendOtpBtn.textContent = 'Sending...';
  try {
    const resp = await fetch('signin.php', {
      method:'POST',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      credentials:'include',
      body: new URLSearchParams({ action:'send_otp', email: e, page:'login' })
    });
    const data = await resp.json();
    if(data.success){
      sendStatus.style.display = 'block'; sendStatus.textContent = 'OTP sent';
      show(otpBlock); show(resendRow);
      sendOtpBtn.textContent = 'OTP Sent';
      startTimer();
      otp.focus();
    } else {
      sendOtpBtn.disabled = false; sendOtpBtn.textContent = 'Send OTP';
      const msg = data.message || 'Failed to send OTP';
      if(/register|not registered|not found/i.test(msg)){
        showServerPopup('User not registered', msg);
      } else {
        showServerPopup('Notice', msg);
      }
    }
  } catch(e){
    console.error(e);
    sendOtpBtn.disabled = false; sendOtpBtn.textContent = 'Send OTP';
    showServerPopup('Error', 'Error sending OTP — please try again');
  }
});

function startTimer(){
  secondsLeft = 60; clearTimer();
  resendBtn.textContent = `Resend in ${secondsLeft}s`; resendBtn.style.pointerEvents = 'none';
  otpTimer = setInterval(()=> {
    secondsLeft--;
    resendBtn.textContent = (secondsLeft>0)?`Resend in ${secondsLeft}s`:'Resend';
    if(secondsLeft<=0){ clearTimer(); resendBtn.style.pointerEvents='auto'; }
  }, 1000);
}
function clearTimer(){ if(otpTimer){ clearInterval(otpTimer); otpTimer = null; } }

resendBtn.addEventListener('click', async ()=>{
  if(resendBtn.textContent.indexOf('Resend')===-1 && resendBtn.style.pointerEvents==='none') return;
  sendOtpBtn.disabled = true; sendOtpBtn.textContent = 'Sending...';
  try {
    const resp = await fetch('signin.php', {
      method:'POST',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      credentials:'include',
      body: new URLSearchParams({ action:'send_otp', email: email.value.trim().toLowerCase(), page:'login' })
    });
    const data = await resp.json();
    if(data.success){
      sendStatus.style.display='block'; sendStatus.textContent='OTP resent';
      startTimer(); sendOtpBtn.textContent='OTP Sent';
    } else {
      sendOtpBtn.disabled = false; sendOtpBtn.textContent='Send OTP';
      const msg = data.message || 'Failed to resend';
      if(/register|not registered|not found/i.test(msg)){
        showServerPopup('User not registered', msg);
      } else {
        showServerPopup('Notice', msg);
      }
    }
  } catch(e){
    console.error(e);
    sendOtpBtn.disabled=false; sendOtpBtn.textContent='Send OTP';
    showServerPopup('Error', 'Error resending OTP — please try again');
  }
});

/* OTP input & verify */
otp.addEventListener('input', ()=>{
  otp.value = otp.value.replace(/\D/g,'').slice(0,6);
  const ok = otp.value.trim().length>0;
  verifyOtpBtn.disabled = !ok;
  verifyOtpBtn.classList.toggle('disabled', !ok);
});

verifyOtpBtn.addEventListener('click', async ()=>{
  const e = email.value.trim().toLowerCase(); const value = otp.value.trim();
  if(!e || !value) return;
  verifyOtpBtn.disabled = true; verifyOtpBtn.textContent = 'Verifying...';
  try {
    const resp = await fetch('signin.php', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'include',
      body: JSON.stringify({ action:'verify_otp', email: e, otp: value })
    });
    const data = await resp.json();
    if(data.success){
      successMsg.style.display='block'; successMsg.textContent='OTP verified — signing in...';
      // complete server login
      const resp2 = await fetch('signin.php', {
        method:'POST',
        headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
        credentials:'include',
        body: new URLSearchParams({ action:'complete_otp_login', email: e })
      });
      const d2 = await resp2.json();
      if(d2.success){
        if(d2.client_id) localStorage.setItem('client_id', d2.client_id);
        if(d2.user_id) localStorage.setItem('user_id', d2.user_id);
        if(d2.role) localStorage.setItem('role', d2.role);
        if(d2.name) localStorage.setItem('userName', d2.name);
        if(d2.email) localStorage.setItem('signedInUserEmail', d2.email);

        // show OTP verified label on the send button
        sendOtpBtn.textContent = 'OTP verified';
        sendOtpBtn.disabled = true;
        // redirect after short delay
        const redirect = d2.redirect || '/doctor_app/dashboard/dashboard.html';
        setTimeout(()=> window.location.href = redirect, 220);
      } else {
        // fallback redirect
        sendOtpBtn.textContent = 'OTP verified';
        sendOtpBtn.disabled = true;
        setTimeout(()=> window.location.href = '/doctor_app/dashboard/dashboard.html', 220);
      }
    } else {
      const otpError = document.getElementById('otpError');
      otpError.style.display='block'; otpError.textContent = data.message || 'OTP mismatch';
      verifyOtpBtn.disabled = false; verifyOtpBtn.textContent = 'Verify OTP';
    }
  } catch(e){
    console.error(e);
    const otpError = document.getElementById('otpError');
    otpError.style.display='block'; otpError.textContent='Error verifying';
    verifyOtpBtn.disabled=false; verifyOtpBtn.textContent='Verify OTP';
  }
});

/* server popup: dismiss behavior */
serverPopupOk.addEventListener('click', ()=>{
  hideServerPopup();
  // focus the email field so the user can correct or sign up
  email.focus();
});

/* also close popup if user presses Escape while it's open */
document.addEventListener('keydown', (ev)=>{
  if(ev.key === 'Escape' && serverPopup.classList.contains('show')){
    hideServerPopup();
    email.focus();
  }
});
</script>
</body>
</html>
