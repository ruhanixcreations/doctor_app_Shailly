<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../header/header.css">
<style>
  /* (kept your previous style unchanged) */
  :root{
    --navy:#0b2340;
    --sea:#6f9ef0;
    --sea-dark:#183159;
    --muted:#6f7f8f;
    --card-bg:#fff;
    --radius:14px;
    --control-height:50px;
    --input-shadow: 0 14px 40px rgba(13,30,60,0.12);
    --input-focus-shadow: 0 18px 50px rgba(25,72,160,0.18);
    --btn-shadow: 0 14px 34px rgba(24,57,89,0.16);
    --popup-backdrop: rgba(6,12,24,0.36);
    --popup-bg: #fff8f6;
    --popup-border: rgba(221,85,72,0.12);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
body.app-shell{
      font-family:"Inter","Poppins",system-ui,Arial,sans-serif;
      background:linear-gradient(180deg,#e9f3ff 0%,#f7fbff 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      padding-top:140px;
      color:#071123;
      -webkit-font-smoothing:antialiased;
    }

  .signup-wrapper{
    width:100%;
    max-width:820px;
    padding:12px;
    display:flex;
    justify-content:center;
  }

  .signup-card{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg,var(--card-bg),#fbfdff);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 22px 60px rgba(9,30,66,0.10);
    border:1px solid rgba(16,42,83,0.06);
    min-height:420px;
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
    overflow:visible;
  }

  .brand-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:6px}
  .brand-logo{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(90deg,var(--navy),var(--sea-dark));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }

  .signup-title{
    font-size:20px;
    text-align:center;
    font-weight:800;
    color:#071123;
    margin-bottom:4px;
    line-height:1.05;
  }
  .signup-title span{ color:var(--sea-dark); font-weight:700 }

  .signup-subtitle{text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px}

  .signup-input,
  .signup-input-email,
  .signup-input-otp,
  .signup-input-password{
    width:100%;
    padding:10px 12px;
    font-size:15px;
    border-radius:12px;
    border:1px solid rgba(8,18,33,0.10);
    background:linear-gradient(180deg,#fff,#fbfdff);
    height:44px;
    color:#071123;
    margin-bottom:6px;
    box-shadow: var(--input-shadow);
    transition: box-shadow .12s, border-color .12s, transform .06s;
  }
  .signup-input::placeholder,
  .signup-input-email::placeholder,
  .signup-input-otp::placeholder,
  .signup-input-password::placeholder {
    color: rgba(11,18,35,0.45);
  }
  .signup-input:focus,
  .signup-input-email:focus,
  .signup-input-otp:focus,
  .signup-input-password:focus{
    outline: none;
    border-color: var(--sea-dark);
    box-shadow: var(--input-focus-shadow);
    transform: translateY(-1px);
  }

  .signup-input-group{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .email-otp-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .email-otp-row .email-col{flex:1 1 60%;min-width:0}
  .email-otp-row .btn-col{flex:0 0 34%;display:flex;align-items:center;justify-content:flex-end}

  #sendOtpBtn, #verifyOtpBtn {
    height:44px;
    padding:10px 14px;
    width:140px;
    min-width:200px;
    border-radius:10px;
    border:none;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(90deg,var(--sea),var(--sea-dark));
    box-shadow:var(--btn-shadow);
  }
  #sendOtpBtn:disabled,#verifyOtpBtn:disabled{
    background: lightgray;
    cursor:not-allowed;opacity:0.95;
    box-shadow:none;
  }

  .register-button{
    width:100%;
    padding:10px 14px;
    border-radius:12px;
    border:none;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    margin-top:6px;
    color:#fff;
    background:linear-gradient(90deg,var(--sea-dark),var(--sea));
    box-shadow:var(--btn-shadow);
  }
  .register-button:disabled{background:lightgray;color:#f3f6ff;cursor:not-allowed;box-shadow:none}

  .separator{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);justify-content:center;font-size:12px}
  .separator::before,.separator::after{content:"";height:1px;flex:1;background:rgba(16,42,83,0.06)}

  .signup-resend{font-size:14px;color:var(--sea-dark);text-align:center;margin-bottom:6px}
  .signup-resend span{font-weight:700;color:var(--sea-dark);padding:6px 8px;border-radius:8px;cursor:pointer}
  .signup-resend span.disabled{opacity:0.5;cursor:not-allowed}

  .otpErrorMessage{color:#c03b3b;font-size:13px;margin-top:6px;text-align:left}
  .otpErrorInput{border-color:#c03b3b !important;box-shadow:0 0 0 4px rgba(192,59,59,0.06) !important}

  #popupOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:var(--popup-backdrop);
    z-index:999;
    justify-content:center;
    align-items:center;
  }
  #popupOverlay .popup-box{
    background:var(--popup-bg);
    padding:18px;
    border-radius:12px;
    max-width:520px;
    width:92%;
    text-align:center;
    color:#071123;
    box-shadow:0 30px 80px rgba(8,18,40,0.18);
    border:1px solid var(--popup-border);
  }
  #popupOverlay .popup-box p{font-size:15px;margin-bottom:12px}
  #popupOverlay .popup-box button{height:44px;padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--sea),var(--sea-dark));color:#fff;font-weight:700;box-shadow:var(--btn-shadow);cursor:pointer}

  .signin-link{text-align:center;margin-top:8px;font-size:14px;color:var(--muted)}
  .signin-link a{color:var(--sea-dark);font-weight:700;text-decoration:none}
  .footer-banner{margin-top:10px;text-align:center;color:var(--muted);font-size:13px}

  .pwd-row{display:flex;gap:8px;align-items:center}
  .show-toggle{cursor:pointer;font-size:14px;color:var(--sea-dark);padding:6px}

  .error-message{color:#c03b3b;font-size:0.95rem;margin-top:4px;margin-bottom:6px}
  .success-message{color:#1f8f6b;font-size:0.95rem;margin-top:4px;margin-bottom:6px}

  @media(max-width:600px){
    .signup-wrapper{padding:6px}
    .signup-card{
      width: calc(100vw - 12px);
      max-width:none;
      padding:14px;
      border-radius:12px;
      min-height:480px;
      gap:10px;
    }
    .brand-logo{width:48px;height:48px}
    .signup-title{font-size:18px}
    .signup-input,
    .signup-input-email,
    .signup-input-otp,
    .signup-input-password{
      height:52px;
      padding:12px 14px;
      margin-bottom:8px;
    }
    .email-otp-row{flex-direction:column;align-items:stretch;gap:8px}
    .email-otp-row .btn-col{display:flex;justify-content:flex-end}
    #sendOtpBtn,#verifyOtpBtn{width:140px;height:46px}
    .register-button{height:48px}
    .footer-banner{font-size:13px}
  }

  @media(min-width:1200px){
    .signup-card{ max-width:600px; padding:20px; min-height:400px; gap:8px }
  }

  *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
</style>
</head>
  <body class="app-shell" data-app-root="..">
  <div class="signup-wrapper">
    <div class="signup-card" role="main" aria-labelledby="signupHeading">
      <div class="brand-row" aria-hidden="true">
        <div class="brand-logo">RL</div>
      </div>

      <h1 id="signupHeading" class="signup-title">Welcome <span>— Create an account</span></h1>
      <p class="signup-subtitle">Create your account securely — we'll verify your email with OTP</p>

      <!-- Banner inserted by JS when role is preselected -->

      <input type="text" id="name" placeholder="Enter your name" class="signup-input" autocomplete="name" />
      <div id="nameError" class="error-message" style="display:none"></div>

      <input type="tel" id="mobile" placeholder="Enter mobile number" class="signup-input" autocomplete="tel" />
      <div id="mobileError" class="error-message" style="display:none"></div>

      <div class="email-otp-row">
        <div class="email-col">
          <input type="email" id="email" placeholder="Enter Email ID" class="signup-input-email" autocomplete="email" />
          <div id="emailError" class="error-message" style="display:none"></div>
          <p id="infoMessage" style="display:none;font-size:13px;color:var(--muted)">(OTP may take up to 30s — check promotions)</p>
          <div id="sendSuccess" class="success-message" style="display:none"></div>
        </div>

        <div class="btn-col">
          <button id="sendOtpBtn" class="signup-button" type="button">Send OTP to Verify Email-Id</button>
        </div>
      </div>

      <div id="otpSection" class="signup-input-group" style="display:none">
        <input type="text" id="otp" placeholder="Paste OTP here" class="signup-input-otp" autocomplete="one-time-code" />
        <div id="otpError" class="otpErrorMessage" style="display:none"></div>
        <button id="verifyOtpBtn" class="signup-button" type="button">Verify OTP</button>
        <div id="verifySuccess" class="success-message" style="display:none"></div>
      </div>

      <div id="resendContainer" class="signup-resend" style="display:none;">
        Didn't receive code? <span id="resendText" class="disabled">Resend in <span id="timer">60</span>s</span>
      </div>

      <div id="passwordBlock" class="signup-input-group" style="display:block;">
        <input type="password" id="password" placeholder="Create password (min 6 chars)" class="signup-input-password" autocomplete="new-password" />
        <div class="pwd-row" style="justify-content:space-between;">
          <input type="password" id="confirmPassword" placeholder="Confirm password" class="signup-input-password" style="flex:1;" autocomplete="new-password" />
          <div class="show-toggle" id="toggleShow" title="Show/Hide" style="margin-left:8px;">👁️</div>
        </div>
        <div id="pwdError" class="error-message" style="display:none"></div>
      </div>

      <button class="register-button" onclick="register()" id="registerBtn" disabled>Create account</button>

      <div class="signin-link">Already have an account? <a href="../signin/signin.html">Sign in!</a></div>
      <div class="footer-banner">Secure · Trusted · Professional</div>
    </div>
  </div>

  <div id="popupOverlay"><div class="popup-box"><p id="popupMessage"></p><button onclick="closePopup()">OK</button></div></div>

<script defer src="../header/header.js" data-header-root="../header" data-app-root=".."></script>
<script>
  /* ---------- element references ---------- */
  const nameInput = document.getElementById("name");
  const nameError = document.getElementById("nameError");
  const mobileInput = document.getElementById("mobile");
  const mobileError = document.getElementById("mobileError");
  const emailInput = document.getElementById("email");
  const emailError = document.getElementById("emailError");
  const sendOtpBtn = document.getElementById("sendOtpBtn");
  const sendSuccess = document.getElementById("sendSuccess");
  const otpSection = document.getElementById("otpSection");
  const otpInput = document.getElementById("otp");
  const verifyOtpBtn = document.getElementById("verifyOtpBtn");
  const verifySuccess = document.getElementById("verifySuccess");
  const resendContainer = document.getElementById("resendContainer");
  const resendText = document.getElementById("resendText");
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirmPassword");
  const pwdError = document.getElementById("pwdError");
  const registerBtn = document.getElementById("registerBtn");
  const toggleShow = document.getElementById("toggleShow");
  const otpError = document.getElementById("otpError");

  let timerInterval = null;
  let isOtpVerified = false;
  let nextParam = null;
  let preselectedRole = null; // NEW: role passed via URL

  nameInput.addEventListener("input", (e) => {
    const clean = e.target.value.replace(/[^A-Za-z\s]/g, "");
    if (e.target.value !== clean) e.target.value = clean;
    monitorFields();
  });

  mobileInput.addEventListener("input", (e) => {
    let clean = e.target.value.replace(/\D/g, "");
    if (clean.length > 10) clean = clean.slice(0, 10);
    e.target.value = clean;

    if (clean.length > 0 && clean.length < 10) {
      mobileError.style.display = "block";
      mobileError.textContent = "Enter valid mobile";
    } else {
      mobileError.style.display = "none";
      mobileError.textContent = "";
    }
    monitorFields();
  });

  function showErrorBelow(elem, msg){
    if (elem === emailInput) {
      emailError.textContent = msg;
      emailError.style.display = msg ? "block" : "none";
    } else if (elem === nameInput) {
      nameError.textContent = msg;
      nameError.style.display = msg ? "block" : "none";
    } else if (elem === mobileInput) {
      mobileError.textContent = msg;
      mobileError.style.display = msg ? "block" : "none";
    }
  }
  function clearErrorBelow(elem){
    if (elem === emailInput) { emailError.textContent = ""; emailError.style.display = "none"; }
    if (elem === nameInput) { nameError.textContent = ""; nameError.style.display = "none"; }
    if (elem === mobileInput) { mobileError.textContent = ""; mobileError.style.display = "none"; }
  }
  function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function validatePasswords(){
    const p = passwordInput.value.trim();
    const cp = confirmPasswordInput.value.trim();
    pwdError.style.display = "none";
    if(p.length > 0 && p.length < 6){
      pwdError.textContent = "Password must be at least 6 characters.";
      pwdError.style.display = "block";
      return false;
    }
    if(cp.length > 0 && p !== cp){
      pwdError.textContent = "Passwords do not match.";
      pwdError.style.display = "block";
      return false;
    }
    if(p.length === 0 || cp.length === 0) {
      pwdError.style.display = "none";
      return false;
    }
    pwdError.style.display = "none";
    return p === cp && p.length >= 6;
  }

  function monitorFields(){
    const name = nameInput.value.trim();
    const mobile = mobileInput.value.trim();
    const email = emailInput.value.trim();
    const passwordsValid = validatePasswords();

    if (!name) {
      showErrorBelow(nameInput, "Name is required and should contain only letters.");
    } else {
      clearErrorBelow(nameInput);
    }

    if (!mobile || mobile.length !== 10) {
      // mobileError displayed by input handler
    } else {
      clearErrorBelow(mobileInput);
    }

    if (email && !isValidEmail(email)) {
      showErrorBelow(emailInput, "Enter a valid email.");
    } else if (!email) {
      clearErrorBelow(emailInput);
    } else {
      if (!emailError.textContent) clearErrorBelow(emailInput);
    }

    if (name && mobile && mobile.length === 10 && email && isValidEmail(email) && isOtpVerified && passwordsValid) {
      registerBtn.disabled = false;
    } else {
      registerBtn.disabled = true;
    }
  }

  sendOtpBtn.addEventListener("click", sendOtp);
  function sendOtp(){
    const email = emailInput.value.trim().toLowerCase();
    sendSuccess.style.display = "none";
    otpError.style.display = "none";
    verifySuccess.style.display = "none";
    clearErrorBelow(emailInput);

    if(!email){
      showErrorBelow(emailInput, "Please enter email to receive OTP.");
      return;
    }
    if(!isValidEmail(email)){
      showErrorBelow(emailInput, "Enter a valid email address.");
      return;
    }

    sendOtpBtn.disabled = true;
    sendOtpBtn.textContent = "Sending...";

    fetch("./signup.php", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({ action: "send_otp", email, page: "register" }),
      credentials: "include"
    })
    .then(r => r.json())
    .then(data => {
      if(data.success){
        otpSection.style.display = "flex";
        resendContainer.style.display = "block";
        sendSuccess.style.display = "block";
        sendSuccess.textContent = "OTP sent to your email.";
        sendOtpBtn.textContent = "Send OTP";
        startTimer();
      } else {
        showPopup(data.message || "Failed to send OTP.");
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP";
      }
    })
    .catch(() => {
      sendOtpBtn.disabled = false;
      sendOtpBtn.textContent = "Send OTP";
      showPopup("Something went wrong while sending OTP.");
    });
  }

  function startTimer(){
    let seconds = 60;
    resendText.classList.add("disabled");
    resendText.innerHTML = `Resend in <span id="timer">${seconds}</span>s`;

    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      seconds--;
      const t = document.getElementById("timer");
      if(t) t.textContent = seconds;
      if(seconds <= 0){
        clearInterval(timerInterval);
        resendText.classList.remove("disabled");
        resendText.textContent = "Resend";
        resendText.onclick = () => sendOtp();
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP";
      }
    }, 1000);
  }

  verifyOtpBtn.addEventListener("click", verifyOtp);
  function verifyOtp(){
    const email = emailInput.value.trim().toLowerCase();
    const otp = otpInput.value.trim();
    otpError.style.display = "none";
    verifySuccess.style.display = "none";

    if(!otp){ showPopup("Please enter OTP."); return; }

    verifyOtpBtn.disabled = true;
    verifyOtpBtn.textContent = "Verifying...";

    fetch("./signup.php", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({ action: "verify_otp", email, otp }),
      credentials: "include"
    })
    .then(r => r.json())
    .then(data => {
      if(data.success){
        isOtpVerified = true;
        otpSection.style.display = "none";
        sendOtpBtn.textContent = "Verified";
        sendOtpBtn.disabled = true;
        resendContainer.style.display = "none";
        verifySuccess.style.display = "block";
        verifySuccess.textContent = "Email verified";
        otpInput.value = "";
        monitorFields();
      } else {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "Verify OTP";
        otpError.textContent = data.message || "Invalid OTP";
        otpError.style.display = "block";
        otpInput.classList.add("otpErrorInput");
      }
    })
    .catch(() => {
      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = "Verify OTP";
      showPopup("Something went wrong while verifying OTP.");
    });
  }

  toggleShow.addEventListener("click", () => {
    const newType = passwordInput.type === "password" ? "text" : "password";
    passwordInput.type = newType;
    confirmPasswordInput.type = newType;
    toggleShow.textContent = newType === "text" ? "🙈" : "👁️";
  });

  function register(){
    const name = nameInput.value.trim();
    const mobile = mobileInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!name) { showPopup("Name is required."); return; }
    if (!mobile || mobile.length !== 10) { showPopup("Enter valid mobile number."); return; }
    if (!isValidEmail(email)) { showPopup("Enter valid email."); return; }
    if (!isOtpVerified) { showPopup("Please verify your email before registering."); return; }
    if (!validatePasswords()) { showPopup("Please fix password fields."); return; }

    registerBtn.disabled = true;
    registerBtn.textContent = "Creating...";

    const postData = { action: "register", name, mobile, email, password };
    if (preselectedRole) postData.role = preselectedRole; // include role if present

    fetch("./signup.php", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams(postData),
      credentials: "include"
    })
    .then(r => r.json())
    .then(data => {
      if(data.success){
        localStorage.setItem("isLoggedIn","true");
        localStorage.setItem("client_id", data.client_id || "");
        localStorage.setItem("user_id", data.user_id || "");
        localStorage.setItem("role", data.role || (preselectedRole || "user"));
        localStorage.setItem("userName", data.name || name);
        localStorage.setItem("signedInUserEmail", email);
        localStorage.setItem("Mobile Number", data.mobile || mobile);
        if (nextParam === "upload_tree") {
          window.location.href = "/doctor_app/dashboard/upload_video/upload_video.html";
        } else {
          window.location.href = "/doctor_app/dashboard/dashboard.html";
        }
      } else {
        registerBtn.disabled = false;
        registerBtn.textContent = "Create account";
        showPopup(data.message || "Registration failed.");
      }
    })
    .catch(() => {
      registerBtn.disabled = false;
      registerBtn.textContent = "Create account";
      showPopup("Something went wrong while registering.");
    });
  }

  function showPopup(msg){
    document.getElementById("popupMessage").textContent = msg;
    document.getElementById("popupOverlay").style.display = "flex";
    const ok = document.querySelector('#popupOverlay .popup-box button');
    if(ok) ok.focus();
  }
  function closePopup(){
    document.getElementById("popupMessage").textContent = "";
    document.getElementById("popupOverlay").style.display = "none";
  }

  [nameInput, emailInput, passwordInput, confirmPasswordInput].forEach(el=>{
    el.addEventListener("input", monitorFields);
  });

  verifyOtpBtn.disabled = true;
  otpInput.addEventListener("input", () => {
    otpError.style.display = "none";
    otpInput.classList.remove("otpErrorInput");
    verifyOtpBtn.disabled = otpInput.value.trim().length === 0;
  });

  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    nextParam = urlParams.get("next");

    // read role param and show banner
    preselectedRole = urlParams.get("role");
    if (preselectedRole) {
      preselectedRole = preselectedRole.trim().toLowerCase();
      const banner = document.createElement('div');
      banner.style.background = 'linear-gradient(90deg,#f0f7ff,#fff)';
      banner.style.border = '1px solid rgba(11,18,35,0.06)';
      banner.style.padding = '8px 10px';
      banner.style.borderRadius = '8px';
      banner.style.marginBottom = '8px';
      banner.style.fontSize = '13px';
      banner.style.color = '#0b2340';
      banner.textContent = `Creating account with role: ${preselectedRole}`;
      const card = document.querySelector('.signup-card');
      if (card) card.insertBefore(banner, card.firstChild.nextSibling);
    }
  });
</script>

</body>
</html>
