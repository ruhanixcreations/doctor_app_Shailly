<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>All Medicines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0b2340;
      --sea:#6f9ef0;
      --sea-dark:#183159;
      --muted:#6f7f8f;
      --card-bg:#ffffff;
      --radius:12px;
      --control-height:46px;
      --input-shadow: 0 12px 30px rgba(13,30,60,0.08);
      --input-focus-shadow: 0 14px 40px rgba(25,72,160,0.12);
      --btn-shadow: 0 14px 34px rgba(24,57,89,0.10);
      --glass: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(250,252,255,0.98));
      --bg: linear-gradient(180deg,#e9f3ff 0%,#f7fbff 100%);
      --overlay: rgba(6,12,24,0.48);
      --disabled-grey: #cfcfcf;
      --disabled-text: #6b6b6b;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"Inter","Poppins",system-ui,Arial,sans-serif;
      background:var(--bg);
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:22px;
      color:#071123;
      -webkit-font-smoothing:antialiased;
    }

    .container {
      width:100%;
      max-width:980px;
      margin:18px auto;
      padding:16px;
      background: var(--glass);
      border-radius:var(--radius);
      box-shadow: 0 20px 60px rgba(9,30,66,0.08);
      border:1px solid rgba(16,42,83,0.04);
      overflow:visible;
    }

    h2{
      font-size:20px;
      font-weight:700;
      color:var(--navy);
      margin-bottom:10px;
    }

    .top-row{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .left-controls{ display:flex; gap:12px; align-items:center; flex:1; min-width:0; }
    .right-controls{ display:flex; gap:12px; align-items:center; justify-content:flex-end; flex:0 0 auto; flex-direction:column; align-items:flex-end; }

    .input-inline-stub{
      display:flex; gap:8px; align-items:center; flex:1; flex-wrap:wrap;
    }
    .input-inline-stub input, .input-inline-stub select{
      height:40px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid rgba(8,18,33,0.07);
      background:#fff;
      min-width:120px;
      font-size:14px;
      color:#071123;
    }

    .btn {
      height:var(--control-height);
      padding:10px 14px;
      border-radius:10px;
      border:none;
      font-weight:700;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(90deg,var(--sea-dark),var(--sea));
      box-shadow:var(--btn-shadow);
      transition: transform .08s ease, box-shadow .12s, opacity .12s;
    }
    .btn:active{ transform: translateY(1px) }
    .btn.ghost{
      background:transparent;color:var(--sea-dark);border:1px solid rgba(24,57,89,0.06);box-shadow:none;height:40px;padding:8px 12px;border-radius:10px;
    }
    /* Disabled buttons are grey with grey text as requested */
    .btn[disabled]{
      background: var(--disabled-grey) !important;
      color: var(--disabled-text) !important;
      cursor:not-allowed;
      box-shadow:none;
      transform:none;
      opacity:1; /* keep full opacity since color indicates disabled */
    }

    #status.small{ font-size:13px; color:var(--muted); margin-top:6px; text-align:right; min-height:18px; }

    .search-block{ margin-top:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    #filter{
      width:100%;
      height:44px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(8,18,33,0.07);
      background:linear-gradient(180deg,#fff,#fbfdff);
      box-shadow: var(--input-shadow);
      font-size:14px;
      color:#071123;
    }

    /* Table */
    .table-wrapper { width:100%; overflow:hidden; border-radius:10px; margin-top:14px; }
    .table {
      width:100%;
      border-collapse:collapse;
      background:transparent;
      border-radius:10px;
      overflow:hidden;
      table-layout:fixed;
    }
    .table thead tr{
      background:linear-gradient(90deg, rgba(111,158,240,0.08), rgba(24,49,89,0.03));
      color:var(--navy);
      font-weight:600;
      font-size:13px;
    }
    .table th, .table td{
      padding:12px 14px;
      border-bottom:1px solid rgba(11,18,35,0.04);
      text-align:left;
      font-size:14px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .table tbody tr{ background: #fff; }
    .table tbody tr:hover{ background: linear-gradient(90deg, rgba(111,158,240,0.03), rgba(255,255,255,0.6)); }

    .action-btn{ height:36px; padding:6px 10px; border-radius:8px; border:none; cursor:pointer; font-weight:700; font-size:13px; box-shadow:none; }
    .action-btn.delete{ color:#c03b3b; background:transparent; border:1px solid rgba(192,59,59,0.08); }

    .empty { padding:22px 12px; color:var(--muted); text-align:center; font-size:14px; }

    /* Modal styles */
    .modal-overlay{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--overlay); z-index:1200;
      padding:18px;
    }
    .modal{
      width:100%;
      max-width:520px;
      background:#fff;
      border-radius:12px;
      padding:18px;
      box-shadow:0 30px 80px rgba(8,18,40,0.18);
      border:1px solid rgba(16,42,83,0.06);
      transform: translateY(8px);
    }
    .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .modal-title{ font-weight:700; color:var(--navy); font-size:16px; }
    .modal-body{ display:flex; gap:10px; flex-direction:column; }
    .form-row{ display:flex; gap:8px; }
    .form-row input, .form-row select{
      flex:1; height:44px; padding:10px 12px; border-radius:10px; border:1px solid rgba(8,18,33,0.08); background:#fff; font-size:14px;
      box-shadow: var(--input-shadow);
    }
    .modal-foot{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
    .note-small{ font-size:13px; color:var(--muted); margin-top:6px; text-align:right; }

    @media(max-width:760px){
      .container{ padding:12px; }
      .modal{ max-width:520px; width:94%; padding:14px; border-radius:10px; }
      .modal-title{ font-size:15px; }
      .form-row{ flex-direction:column; }
      .form-row input, .form-row select{ width:100%; }
      .right-controls{ flex:0 0 auto; }
      .btn{ height:44px; padding:10px 12px; }
      .action-btn{ width:100px; }
      .table thead { display:none; }
      .table, .table tbody, .table tr, .table td { display:block; width:100%; }
      .table tr { margin-bottom:12px; border-radius:10px; box-shadow: 0 8px 20px rgba(9,30,66,0.04); overflow:hidden; }
      .table td { display:flex; justify-content:space-between; padding:10px 12px; border-bottom:1px solid rgba(11,18,35,0.04); white-space:normal; }
      .table td::before{ content: attr(data-label); font-weight:600; color:var(--muted); margin-right:8px; flex:0 0 42%; }
      .table td > div { flex:1 1 auto; text-align:right; }
    }

    @media(max-width:420px){
      .modal{ width:96%; padding:12px; }
      .btn{ height:42px; font-size:14px; }
    }

    .visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px, 1px, 1px, 1px); white-space:nowrap; }
  </style>
</head>
<body>
<main class="container" role="main">
  <h2>All Medicines</h2>

  <div class="top-row" style="margin-bottom:6px;">
    <div class="left-controls">
      <!-- removed the quick filter - only primary filter below remains -->
    </div>

    <div class="right-controls">
      <button id="showModalBtn" class="btn" aria-haspopup="dialog" aria-controls="addMedModal">Add Medicine</button>
      <!-- Status element -->
      <div id="status" class="small" style="color:var(--muted);margin-top:6px;"></div>
    </div>
  </div>

  <div class="search-block" style="margin-bottom:6px;">
    <input id="filter" placeholder="Filter by name, company, form or strength" aria-label="Filter medicines">
  </div>

  <div class="table-wrapper">
    <table class="table" id="medTable" role="table" aria-label="Medicines table">
      <thead><tr><th style="width:30%;">Name</th><th style="width:25%;">Company</th><th style="width:18%;">Form</th><th style="width:17%;">Strength</th><th style="width:110px"></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;">
  <div class="modal" id="addMedModal" role="document" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Add Medicine</div>
      <button id="closeModal" class="btn ghost" aria-label="Close dialog">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-row">
        <input id="modalName" placeholder="Medicine name" aria-label="Medicine name">
      </div>

      <div class="form-row">
        <input id="modalCompany" placeholder="Company" aria-label="Company">
        <input id="modalStrength" placeholder="Strength (e.g. 500mg)" aria-label="Strength">
      </div>

      <div class="form-row">
        <select id="modalForm" aria-label="Form (Tablet, Syrup, Injection)">
          <option value="">Form (choose)</option>
          <option value="Tablet">Tablet</option>
          <option value="Syrup">Syrup</option>
          <option value="Injection">Injection</option>
          <option value="Capsule">Capsule</option>
          <option value="Cream">Cream</option>
          <option value="Drops">Drops</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="note-small">All fields are required to enable <strong>Save Medicine</strong>.</div>
    </div>

    <div class="modal-foot">
      <button id="modalCancel" class="btn ghost">Cancel</button>
      <button id="modalSave" class="btn" disabled>Save Medicine</button>
    </div>
  </div>
</div>

<script>
  // Elements
  const showModalBtn = document.getElementById('showModalBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const closeModalBtn = document.getElementById('closeModal');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave = document.getElementById('modalSave');
  const modalName = document.getElementById('modalName');
  const modalCompany = document.getElementById('modalCompany');
  const modalForm = document.getElementById('modalForm');
  const modalStrength = document.getElementById('modalStrength');
  const statusEl = document.getElementById('status');

  function setStatus(text){
    if(statusEl) statusEl.textContent = text;
  }

  // Open modal
  function openModal(){
    modalOverlay.style.display = 'flex';
    modalOverlay.setAttribute('aria-hidden','false');
    modalName.value = '';
    modalCompany.value = '';
    modalForm.value = '';
    modalStrength.value = '';
    modalSave.disabled = true;
    setTimeout(()=>modalName.focus(), 80);
    document.addEventListener('keydown', handleKeyDown);
  }

  // Close modal
  function closeModalWindow(){
    modalOverlay.style.display = 'none';
    modalOverlay.setAttribute('aria-hidden','true');
    showModalBtn.focus();
    document.removeEventListener('keydown', handleKeyDown);
  }

  showModalBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModalWindow);
  modalCancel.addEventListener('click', closeModalWindow);

  modalOverlay.addEventListener('click', (e) => {
    if(e.target === modalOverlay) closeModalWindow();
  });

  function handleKeyDown(e){
    if(e.key === 'Escape') closeModalWindow();
  }

  // Validate modal inputs and enable Save only when all fields non-empty
  function checkModalValidity(){
    const name = modalName.value.trim();
    const company = modalCompany.value.trim();
    const form = modalForm.value.trim();
    const strength = modalStrength.value.trim();
    modalSave.disabled = !(name && company && form && strength);
  }
  [modalName, modalCompany, modalForm, modalStrength].forEach(el=>{
    el.addEventListener('input', checkModalValidity);
    el.addEventListener('change', checkModalValidity);
  });

  // Single filter that searches across all fields
  document.getElementById('filter').addEventListener('input', renderTableFromMemory);

  // Data loader & renderer
  async function load(){
    try {
      const res = await fetch('all_medicine.php?action=list');
      const j = await res.json();
      if(!j.success){ window.medicines = []; renderTableFromMemory(); return; }
      window.medicines = j.medicines || [];
      renderTableFromMemory();
    } catch (err) {
      console.error(err);
      window.medicines = window.medicines || [];
      renderTableFromMemory();
    }
  }

  // Filter tests all medicine fields (name, company, form, strength)
  function matchesFilter(item, q){
    if(!q) return true;
    q = q.toLowerCase();
    return ((item.name||'').toLowerCase().includes(q)
      || (item.company||'').toLowerCase().includes(q)
      || (item.form||'').toLowerCase().includes(q)
      || (item.strength||'').toLowerCase().includes(q));
  }

  function renderTableFromMemory(){
    const tb = document.querySelector('#medTable tbody'); tb.innerHTML = '';
    const q = document.getElementById('filter').value.trim().toLowerCase();
    const list = (window.medicines || []).filter(m => matchesFilter(m, q));
    if(list.length === 0){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="empty" colspan="5">No medicines found</td>`;
      tb.appendChild(tr);
      return;
    }
    list.forEach(m=>{
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td'); nameTd.setAttribute('data-label','Name'); nameTd.innerHTML = `<div>${escapeHtml(m.name)}</div>`;
      const compTd = document.createElement('td'); compTd.setAttribute('data-label','Company'); compTd.innerHTML = `<div>${escapeHtml(m.company)}</div>`;
      const formTd = document.createElement('td'); formTd.setAttribute('data-label','Form'); formTd.innerHTML = `<div>${escapeHtml(m.form)}</div>`;
      const strengthTd = document.createElement('td'); strengthTd.setAttribute('data-label','Strength'); strengthTd.innerHTML = `<div>${escapeHtml(m.strength)}</div>`;
      const actionsTd = document.createElement('td'); actionsTd.setAttribute('data-label','Actions'); actionsTd.innerHTML = `<div style="display:flex;justify-content:flex-end;gap:8px"><button data-id="${m.id}" class="action-btn delete">Delete</button></div>`;
      tr.appendChild(nameTd); tr.appendChild(compTd); tr.appendChild(formTd); tr.appendChild(strengthTd); tr.appendChild(actionsTd);
      tb.appendChild(tr);
    });

    // delete handlers
    tb.querySelectorAll('.delete').forEach(b=>b.addEventListener('click', async (e)=>{
      if(!confirm('Delete medicine?')) return;
      const id = e.target.dataset.id;
      try {
        const res = await fetch('all_medicine.php?action=delete&id='+encodeURIComponent(id));
        const j = await res.json();
        if(j.success){
          setStatus('Deleted');
          await load();
        } else {
          alert('Delete failed: ' + (j.message || 'unknown'));
        }
      } catch(err){
        alert('Delete failed');
      }
    }));
  }

  // Save from modal
  modalSave.addEventListener('click', async ()=>{
    const name = modalName.value.trim();
    const company = modalCompany.value.trim();
    const form = modalForm.value.trim();
    const strength = modalStrength.value.trim();
    if(!(name && company && form && strength)) return;

    modalSave.disabled = true;
    modalSave.textContent = 'Saving...';

    try {
      const res = await fetch('all_medicine.php?action=add', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, company, form, strength })
      });
      const j = await res.json();
      if(j.success){
        setStatus('Added');
        closeModalWindow();
        await load();
      } else {
        alert('Add failed: ' + (j.message || 'unknown'));
      }
    } catch(err){
      console.error(err);
      alert('Network error while adding medicine.');
    } finally {
      modalSave.textContent = 'Save Medicine';
      checkModalValidity();
    }
  });

  function escapeHtml(s){ if(!s) return ''; return s.toString().replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // initial load
  load();
</script>
</body>
</html>
